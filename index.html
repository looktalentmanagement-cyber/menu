<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2e8b3d"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fffaf3;--card:#fff;--tx:#2a2118;--mut:#7a6d5f;--ac:#2e8b3d;--ac2:#e8590c;--bd:#eadfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#241e18;--tx:#f3ece2;--mut:#a89b8b;--bd:#3a3128;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:18px}.wrap{max-width:900px;margin:auto;padding:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dish{display:flex;gap:10px;align-items:center;margin:0}.em{font-size:34px}.oos{opacity:.5}
.dish .n{font-weight:600}.mut{color:var(--mut);font-size:13px}.ch{margin:16px 2px 8px;font-size:17px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5;cursor:default}
button.o,.btn.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}button.w{background:#25d366}button.r{background:var(--ac2)}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 11px}
.bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px;z-index:4}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.new{background:var(--ac2)}.prep{background:#c9a227}.ready{background:var(--ac)}.done{background:#888}.cx{background:#b3261e}
.stars span{font-size:34px;cursor:pointer;color:#ccc}.stars span.on{color:#f5b301}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:transparent;color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px}.chip{background:transparent;color:var(--tx);border:1px solid var(--bd);white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:14px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.vd{display:inline-block;width:13px;height:13px;border:1.5px solid;position:relative;vertical-align:-1px;border-radius:2px}.vd::after{content:'';position:absolute;inset:2px;border-radius:50%;background:currentColor}.veg{color:#1a8f2e}.nv{color:#b3261e}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.qrc{text-align:center}.qrc div.q{display:flex;justify-content:center;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.sheet{background:var(--card);color:var(--tx);max-width:420px;width:100%;border-radius:14px;padding:16px;max-height:90vh;overflow:auto}
.inv{background:#fff;color:#111;max-width:380px;width:100%;border-radius:12px;padding:18px;max-height:90vh;overflow:auto}
.inv table,.sheet table{width:100%;border-collapse:collapse;font-size:14px}.inv td,.sheet td{padding:3px 0}.r{text-align:right}
.alert{border:2px solid var(--ac2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.note{background:#fff3cd;color:#5c4400;border-radius:8px;padding:6px 8px;margin-top:6px;font-size:14px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;white-space:pre-line;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;max-width:90vw}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.mrow label{font-size:13px;display:flex;align-items:center}
@media print{.noprint,header,#toast{display:none!important}body.pinv *{visibility:hidden}body.pinv .inv,body.pinv .inv *{visibility:visible}body.pinv .inv{position:absolute;left:0;top:0;max-height:none}
body.pqr .wrap{max-width:none;padding:0}body.pqr .qrs{grid-template-columns:repeat(3,1fr);gap:8px}body.pqr .qrc{break-inside:avoid;border:1.5px dashed #888;background:#fff;color:#000}}
.mi{display:flex;gap:8px;align-items:center;margin-bottom:6px;padding:8px 10px}.mi .em{font-size:26px}.mi button{padding:6px 10px}
.st{border:0;border-radius:99px;padding:6px 10px;font-size:13px}.st.on{background:#1a8f2e}.st.off{background:#b3261e}
.ltab{display:flex;gap:6px;margin-bottom:10px}.ltab button{flex:1;background:transparent;color:var(--tx);border:1.5px solid var(--bd);padding:12px}.ltab button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details summary{cursor:pointer}select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
</style></head><body>
<header><b id="hn">Restaurant</b><span id="hr" style="color:#e6f4e8;font-size:13px"></span></header>
<div class="wrap" id="app"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ====== PASTE YOUR FIREBASE CONFIG HERE (see README) ======
const FIREBASE_CONFIG={apiKey:"AIzaSyBuG7ZWKH74-cOejWzw8N_X-PoEn61Tvus",authDomain:"qr-menu-f5e9a.firebaseapp.com",databaseURL:"https://qr-menu-f5e9a-default-rtdb.firebaseio.com",projectId:"qr-menu-f5e9a",appId:"1:613360886334:web:ae1a322f2a470c2644276f"};

// Menu item: n=name, p=price, e=emoji, c=category, v=veg(true/false), o=out of stock
const DEF=[["Paneer Butter Masala",240,"🧀","Main Course"],["Dal Makhani",200,"🍲","Main Course"],["Palak Paneer",230,"🥬","Main Course"],["Veg Biryani",220,"🍛","Rice & Breads"],["Butter Naan",45,"🫓","Rice & Breads"],["Jeera Rice",120,"🍚","Rice & Breads"],["Masala Dosa",130,"🥞","Snacks"],["Chole Bhature",150,"🫘","Snacks"],["Veg Thali",260,"🍱","Thali"],["Gulab Jamun",80,"🍮","Dessert"],["Masala Chai",30,"☕","Drinks"],["Sweet Lassi",70,"🥛","Drinks"]].map(a=>({n:a[0],p:a[1],e:a[2],c:a[3],v:true,o:false}));
const norm=m=>Array.isArray(m)?{n:m[0],p:+m[1]||0,e:m[2]||'🍽',c:'Menu',v:true,o:false}:{n:m.n,p:+m.p||0,e:m.e||'🍽',c:m.c||'Menu',v:m.v!==false,o:!!m.o,g:Array.isArray(m.g)&&m.g.length?m.g:undefined};
let MENU=DEF.slice();

const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HASR=new URLSearchParams(location.search).has('r');
const R=(new URLSearchParams(location.search).get('r')||'demo').toLowerCase().replace(/[^a-z0-9-]/g,'');
const ROOT=location.origin+location.pathname;
const ekey=e=>String(e||'').toLowerCase().replace(/\./g,',');
let CFG={name:HASR?'Restaurant':'QR Menu',tag:'',color:'#2e8b3d',gst:5,offer:'',upi:'',tables:20,wa:'',grev:''},cfgState='loading';
const BASE=location.href.split('#')[0];
let roleState='',myCafes={},ltab='owner',medit=-1,mq='',newV=true,lastCat='';
let cartD={},GST=5,orders=[],calls=[],cart={},fdb=null,base=null,user=null,online=true,ownerState='',seen=null,seenC=null;
let showMenu=false,cat='All',q='',vo=false,tab='orders',offerTxt='';
const SV=()=>firebase.database.ServerValue.TIMESTAMP;
// ---------- app install (PWA) ----------
let DIP=null;const STD=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DIP=e;fillIB()});
addEventListener('appinstalled',()=>{DIP=null;fillIB();toast('✅ App install ho gaya! Home screen pe "QR Menu" icon dekho.')});
function fillIB(){const h=STD?'':DIP?'<button class="r" onclick="installApp()">📲 App install karo</button>':IOS?'<span class="mut">📲 App: Safari mein Share ⬆ → "Add to Home Screen"</span>':'<span class="mut">📲 App: Chrome ⋮ menu → "Install app" / "Add to Home screen"</span>';document.querySelectorAll('.ib').forEach(x=>x.innerHTML=h)}
async function installApp(){if(!DIP)return;DIP.prompt();try{await DIP.userChoice}catch(e){}DIP=null;fillIB()}

// ---------- demo storage (only when no Firebase config: works in one browser) ----------
const LS='qr_orders_'+R,LSC='qr_calls_'+R;
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const lsSet=(k,a)=>{try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}};
const lc=k=>{try{return JSON.parse(localStorage.getItem(k+'_'+R))}catch(e){return null}};
const lw=(k,v)=>{try{localStorage.setItem(k+'_'+R,JSON.stringify(v))}catch(e){}};
function sid(){let s=sessionStorage.getItem('sid');if(!s){s=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('sid',s)}catch(e){}}return s}
const me=()=>base?(user&&user.uid):sid();

function brand(){GST=+CFG.gst||0;document.documentElement.style.setProperty('--ac',CFG.color||'#2e8b3d');document.title=CFG.name;$('#hn').textContent=CFG.name}
function hdr(){$('#hr').textContent=base?(online?'● Live':'● Offline'):'● Demo mode'}

// ---------- writes ----------
async function addOrder(o){
  if(base){
    if(!online){alert('Internet nahi hai, order nahi gaya. Network check karke dobara try karo, ya waiter ko bata do.');return false}
    o.uid=user.uid;o.ts=SV();const up={};up['orders/'+o.id]=o;up['rl/'+user.uid]=SV();
    if(o.phone&&o.optin)up['customers/'+o.phone]={name:o.name||'',ts:SV()};
    try{await base.update(up);return true}
    catch(e){alert(/PERMISSION/i.test(e.code||e.message)?'Thoda ruko: 15 second mein ek hi order ya request ja sakti hai. Phir try karo.':'Order nahi gaya. Dobara try karo ya waiter ko bata do.');return false}
  }
  o.uid=sid();o.ts=Date.now();const a=lsGet(LS);a.push(o);lsSet(LS,a);orders=a;return true;
}
async function updOrder(id,f){
  if(base){try{await base.child('orders/'+id).update(f)}catch(e){alert('Save nahi hua: '+(e.code||e.message))}return}
  const a=lsGet(LS);const o=a.find(x=>x.id===id);if(o)Object.assign(o,f);lsSet(LS,a);orders=a;
}
async function addCall(type,t,amt){
  if(base){
    if(!online){alert('Internet nahi hai. Waiter ko haath se bulao 🙂');return}
    const up={};up['calls/c'+Date.now().toString(36)]=Object.assign({table:t,type,uid:user.uid,ts:SV()},amt?{amt}:{});up['rlc/'+user.uid]=SV();
    try{await base.update(up)}catch(e){delete up['rlc/'+user.uid];up['rl/'+user.uid]=SV();try{await base.update(up)}catch(e2){alert('Abhi request bheji ja chuki hai, 15 second ruko.');return}}
  }else{const a=lsGet(LSC);a.push(Object.assign({k:'c'+Date.now(),table:t,type,ts:Date.now()},amt?{amt}:{}));lsSet(LSC,a)}
  toast(type==='bill'?'🧾 Bill maanga gaya. Staff aa raha hai.':type==='paid'?'🙏 Shukriya! Staff payment check karke bill close karega.':'🙋 Waiter ko bata diya.');
}
async function delCall(k){if(base){try{await base.child('calls/'+k).remove()}catch(e){}}else{lsSet(LSC,lsGet(LSC).filter(c=>c.k!==k));calls=lsGet(LSC);admin()}}
async function saveCfg(){delete CFG.pin;if(base)await base.child('config').set(CFG);else lw('cfg',CFG);brand()}
async function saveMenu(){if(base)await base.child('menu').set(JSON.stringify(MENU));else lw('menu',MENU)}

// ---------- alerts for owner ----------
let AC=null,flashT=null,wl=null;
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume().then(()=>{const b=$('#snd');if(b)b.remove()});if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(x=>wl=x).catch(()=>{})}catch(e){}}
document.addEventListener('click',()=>{if(isAdmin())unlockAudio()});
function beep(){if(!AC)return;try{[0,.3,.6].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.frequency.value=i%2?660:880;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.5,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.25);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+.27)})}catch(e){}}
function uiDlg(msg,mode,def){return new Promise(res=>{const m=document.createElement('div');m.className='modal dlg';m.style.zIndex=50;m.innerHTML=`<div class="sheet"><p style="white-space:pre-wrap;margin-top:0;font-size:16px">${esc(msg)}</p>${mode==='p'?'<input id="dlgi" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">':''}<div class="row"><button id="dlgok">OK</button>${mode!=='a'?'<button class="o" id="dlgno">Cancel</button>':''}</div></div>`;document.body.appendChild(m);const i=m.querySelector('#dlgi');if(i){i.value=def==null?'':def;setTimeout(()=>{i.focus();i.select()},50)}const end=v=>{m.remove();res(v)};m.querySelector('#dlgok').onclick=()=>end(mode==='p'?i.value:true);const no=m.querySelector('#dlgno');if(no)no.onclick=()=>end(mode==='p'?null:false);if(i)i.onkeydown=e=>{if(e.key==='Enter')end(i.value)}})}
function cfm(m){return uiDlg(m,'c')}
function ask(m,d){return uiDlg(m,'p',d)}
window.alert=m=>{uiDlg(String(m),'a')};
function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms||4000)}
function flash(){if(flashT)return;let on=0;const orig=document.title;flashT=setInterval(()=>{document.title=(on^=1)?'🔔 NAYA ORDER':orig},800);const stop=()=>{clearInterval(flashT);flashT=null;document.title=orig;removeEventListener('focus',stop)};addEventListener('focus',stop);setTimeout(stop,30000)}
function adminTick(){
  if(seen){
    const fo=orders.filter(o=>o.status==='new'&&!seen.has(o.id)),fc=calls.filter(c=>!seenC.has(c.k));
    if(fo.length||fc.length){beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);flash();
      toast(fo.map(o=>'🔔 Naya order · Table '+o.table).concat(fc.map(c=>callTxt(c)+' · Table '+c.table)).join('\n'),8000)}
  }
  seen=new Set(orders.map(o=>o.id));seenC=new Set(calls.map(c=>c.k));
  if(isAdmin()&&tab!=='menu'&&tab!=='setup'&&tab!=='qr'&&!$('.modal'))admin();
}
setInterval(()=>{if(isAdmin()&&tab==='orders'&&!$('.modal'))admin()},60000);

// ---------- init & listeners ----------
let offs=[],mode='';
function listen(q,cb){q.on('value',cb,e=>console.warn(e));offs.push(()=>q.off('value',cb))}
function busy(){return(/^#table/.test(location.hash)&&(Object.keys(cart).some(k=>cart[k])||$('.modal')))||(isAdmin()&&(tab==='menu'||tab==='setup'||tab==='qr'))}
function soft(){if(!busy())route()}
async function attach(){
  if(!base)return;
  const h=location.hash,want=/^#table\d+$/.test(h)?'cust':(h==='#admin'&&HASR?'admin':'');
  const key=want+':'+(user?user.uid:'');
  if(key===mode)return;mode=key;offs.forEach(f=>f());offs=[];orders=[];calls=[];seen=null;seenC=null;ownerState='';
  if(want==='cust'){
    if(!user){try{await firebase.auth().signInAnonymously()}catch(e){app.innerHTML='<div class="card">Connect nahi ho paya. Page reload karo.</div>'}return}
    listen(base.child('orders').orderByChild('uid').equalTo(user.uid),s=>{orders=Object.values(s.val()||{});soft()});
  }
  if(want==='admin'&&user&&!user.isAnonymous){
    ownerState='checking';route();
    try{await base.child('owner').once('value');ownerState='ok'}catch(e){ownerState='no';route();return}
    let adm=false;try{adm=(await fdb.ref('admins/'+user.uid).once('value')).val()===true}catch(e){}
    if(!adm){try{const u=await base.child('ownerUid').once('value');if(!u.exists())await base.child('ownerUid').set(user.uid);else if(u.val()!==user.uid){ownerState='no';route();return}}catch(e){}}
    // only recent orders are synced (fast + stays inside free plan limits)
    listen(base.child('orders').orderByChild('ts').startAt(Date.now()-36*3600000),s=>{orders=Object.values(s.val()||{});adminTick()});
    listen(base.child('calls'),s=>{calls=Object.entries(s.val()||{}).map(([k,v])=>Object.assign({},v,{k}));adminTick()});
    route();
  }
}
function init(){
  if(FIREBASE_CONFIG.databaseURL){try{
    firebase.initializeApp(FIREBASE_CONFIG);fdb=firebase.database();base=fdb.ref('restaurants/'+R);
    fdb.ref('.info/connected').on('value',s=>{online=s.val()===true;hdr()});
    base.child('config').on('value',s=>{const v=s.val();if(v){CFG=Object.assign(CFG,v);cfgState='ok'}else cfgState='none';brand();soft()});
    base.child('menu').on('value',s=>{try{const v=JSON.parse(s.val());if(v&&v.length)MENU=v.map(norm)}catch(e){}if(/^#table/.test(location.hash)&&$('#ml'))listMenu();else soft()});
    firebase.auth().onAuthStateChanged(u=>{user=u;roleState='';attach();route()});
  }catch(e){console.error(e);base=null}}
  if(!base){const c=lc('cfg');if(c)CFG=Object.assign(CFG,c);const m=lc('menu');if(m)MENU=m.map(norm);cfgState='ok';
    orders=lsGet(LS);calls=lsGet(LSC);seen=new Set(orders.map(o=>o.id));seenC=new Set(calls.map(c=>c.k));
    addEventListener('storage',()=>{orders=lsGet(LS);calls=lsGet(LSC);if(isAdmin())adminTick();else soft()})}
  brand();hdr();route();
}
const isAdmin=()=>HASR&&location.hash==='#admin';
const callTxt=c=>c.type==='bill'?'🧾 Bill chahiye':c.type==='paid'?'💳 Customer bola: pay kar diya'+(c.amt?' '+rs(c.amt):''):'🙋 Waiter bulaya';
const H=3600000;
const rs=n=>'₹'+n;
const tot=o=>{const s=o.items.reduce((a,i)=>a+i.p*i.q,0),gp=o.gst!=null?o.gst:GST,g=Math.round(s*gp/100);return{s,g,t:s+g,gp}};
const label=o=>o.cx?'Cancelled':({new:'Order received',prep:'Accepted · ban raha hai',ready:'Ready / Served',done:'Completed'}[o.status]);
const vdot=v=>`<span class="vd ${v?'veg':'nv'}" title="${v?'Veg':'Non-veg'}"></span>`;
const ago=ts=>{const m=Math.max(0,Math.round((Date.now()-ts)/60000));return m<1?'abhi':m+' min pehle'};

// ---------- router ----------
addEventListener('hashchange',()=>{attach();route()});
function route(){
  const h=location.hash,m=h.match(/^#table(\d+)$/);
  if(h==='#super')return superPanel();
  if(!HASR&&!m)return landing();
  if(h==='#qr'){tab='qr';history.replaceState(null,'','#admin');return admin()}
  if(cfgState==='loading')return void(app.innerHTML='<div class="card mut">Loading…</div>');
  if(cfgState==='none')return void(app.innerHTML='<div class="card"><h3>Restaurant not found</h3><p class="mut">Link check karo.</p></div>');
  if(m&&+m[1]>=1&&+m[1]<=(+CFG.tables||20))return customer(+m[1]);
  if(h==='#admin')return admin();
  home();
}
function home(){app.innerHTML=`<div class="card"><h2>${esc(CFG.name)}</h2><p class="mut">Customers only see their own table link (from the QR code).</p>
<p><a class="btn" href="#admin">🧑‍🍳 Restaurant dashboard</a> <a class="btn o" href="#qr">🔳 Table QR codes</a> <a class="btn o" href="#table1">👀 Customer view</a></p>
${base?'':'<p class="mut">Demo: open <a href="#table5">Table 5</a>, place an order, then check the dashboard in another tab.</p>'}</div>`}
const qurl=i=>ROOT+'?r='+R+'#table'+i;
function cpLink(i){const u=qurl(i);const ok=()=>toast('🔗 Table '+i+' ka link copy ho gaya',2000);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(u).then(ok,()=>ask('Link copy karo:',u));else ask('Link copy karo:',u)}
function qrTab(v){const n=+CFG.tables||20;

function cartItems(){return Object.keys(cart).filter(k=>cart[k]>0).map(k=>{const d=cartD[k]||{n:k,sel:[]},m=MENU.find(x=>x.n===d.n);if(!m||m.o)return null;

  m.innerHTML=`<div><div class="inv"><h3 style="margin:0">${esc(CFG.name)}</h3><div style="font-size:12px">${esc(CFG.tag)}</div><hr>
<div style="font-size:13px">No: ${no}<br>Table: ${o.table} · ${new Date(o.ts).toLocaleString()}</div><hr>
<table>${o.items.map(i=>`<tr><td>${i.q}× ${esc(i.n)}</td><td class="r">${rs(i.p*i.q)}</td></tr>`).join('')}<tr><td>Subtotal</td><td class="r">${rs(x.s)}</td></tr><tr><td>GST ${x.gp}%</td><td class="r">${rs(x.g)}</td></tr><tr><td><b>Total</b></td><td class="r"><b>${rs(x.t)}</b></td></tr></table><hr><div style="text-align:center;font-size:13px">Thank you, visit again! 🙏</div></div>
<div class="noprint row" style="justify-content:center"><button onclick="printInv()">🖨 Print</button><button class="w" id="wb">WhatsApp bill</button><button class="o" style="background:#fff" onclick="this.closest('.modal').remove()">Close</button></div></div>`;
  document.body.appendChild(m);$('#wb').onclick=()=>open('https://wa.me/'+(o.phone?'91'+o.phone:'')+'?text='+encodeURIComponent(txt),'_blank');
}

// ---------- reseller ----------
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);
let SEC=null,NEWUID=null;
async function mkOwner(email,pw){
  SEC=SEC||firebase.initializeApp(FIREBASE_CONFIG,'sec');
  try{await SEC.auth().setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(e){}
  try{const c=await SEC.auth().createUserWithEmailAndPassword(email,pw);NEWUID=c.user.uid;await SEC.auth().signOut();return 'new'}
  catch(e){if(e.code==='auth/email-already-in-use')return 'exists';throw e}
}
function shareLogin(name,email,pw,exists){
  const txt=`🎉 ${name} ka QR Menu app ready hai!\n\nApp kholo: ${ROOT}\nEmail: ${email}\n${exists?'Password: aapka purana password (bhool gaye to login page pe "Password bhool gaye?")':'Password: '+pw}\n\nLogin karke 🍽 Menu bharo, ⚙ Setup mein UPI/WhatsApp daalo, 🔳 QR tab se table QR print karo.`;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h3 style="margin-top:0">✅ Owner ko ye bhejo</h3><textarea rows="9" readonly id="shx">${esc(txt)}</textarea><div class="row"><button class="w" id="shw">📲 WhatsApp pe bhejo</button><button class="o" id="shc">📋 Copy</button><button class="o" onclick="this.closest('.modal').remove()">Close</button></div></div>`;
  document.body.appendChild(m);$('#shw').onclick=()=>open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  $('#shc').onclick=()=>{navigator.clipboard.writeText(txt).then(()=>toast('Copy ho gaya ✅'),()=>{$('#shx').select();document.execCommand('copy')})}}
let SL={},SO={};
async function superPanel(){
  if(!base)return void(app.innerHTML='<div class="card">Pehle FIREBASE_CONFIG daalo (README dekho).</div>');
  if(!user||user.isAnonymous){ltab='res';return landing()}
  $('#hn').textContent='👑 Reseller panel';
  try{SL=(await fdb.ref('index').once('value')).val()||{}}catch(e){
    return void(app.innerHTML=`<div class="card"><h3>Ye reseller account nahi hai</h3><p class="mut">${esc(user.email)} ko reseller access nahi hai.</p><button onclick="logout()">Logout</button></div>`)}
  const ids=Object.keys(SL);SO={};
  await Promise.all(ids.map(async k=>{try{SO[k]=(await fdb.ref('restaurants/'+k+'/owner').once('value')).val()||''}catch(e){SO[k]=''}}));
  const fix={};ids.forEach(k=>{if(SO[k])fix['owners/'+ekey(SO[k])+'/'+k]=SL[k]});if(ids.length)fdb.ref().update(fix).catch(()=>{});
  app.innerHTML=`<div class="card"><h3 style="margin-top:0">➕ Naya hotel / cafe</h3>
<input id="rn" placeholder="Cafe ka naam (jaise Sahara Cafe)"><input id="rid" placeholder="short-id (apne aap banega)"><input id="re" type="email" placeholder="Owner ka email (isse login karega)"><input id="rp" type="password" placeholder="Owner ka password (6+ characters)" autocomplete="new-password"><label class="mut" style="display:block;margin:2px 0 6px"><input type="checkbox" onchange="$('#rp').type=this.checked?'text':'password'"> Password dikhao</label>
<label class="mut">Menu</label><select id="rcp"><option value="">Sample menu (12 dishes)</option><option value="-">Khaali menu</option>${ids.map(k=>`<option value="${esc(k)}">Copy: ${esc(SL[k])}</option>`).join('')}</select>
<button style="width:100%;margin-top:6px" id="mkb" onclick="mk()">✅ Cafe banao + owner login banao</button></div>
<div class="card"><b>Aapke cafes (${ids.length})</b>${ids.map(k=>`<div style="border-top:1px solid var(--bd);padding:8px 0;margin-top:6px"><b>${esc(SL[k])}</b> <span class="mut">(${esc(k)})</span><div class="mut">Owner: ${esc(SO[k]||'—')}</div><div class="row"><a class="btn" href="${ROOT}?r=${k}#admin">🧑‍🍳 Dashboard</a><a class="btn o" target="_blank" href="${ROOT}?r=${k}#table1">👀 Menu</a><button class="o" onclick="ownLogin('${k}')">🔑 Login</button><button class="o" onclick="chOwner('${k}')">✉ Owner badlo</button><button class="r" onclick="delCafe('${k}')">🗑</button></div></div>`).join('')||'<p class="mut">Abhi koi nahi</p>'}</div>
<div class="row"><button class="o" onclick="logout()">Logout</button><span class="ib"></span></div>`;fillIB();
  let touched=false;$('#rid').oninput=()=>touched=true;$('#rn').oninput=()=>{if(!touched)$('#rid').value=slug($('#rn').value)};
}
async function mk(){
  const name=$('#rn').value.trim(),id=slug($('#rid').value.trim()||name),email=$('#re').value.trim().toLowerCase(),pw=$('#rp').value;
  if(!name||!id||!/^\S+@\S+\.\S+$/.test(email))return alert('Naam, short-id aur sahi owner email bharo');
  if(pw.length<6)return alert('Owner password kam se kam 6 characters ka rakho');
  const b=$('#mkb');b.disabled=true;b.textContent='Ban raha hai…';const done=()=>{b.disabled=false;b.textContent='✅ Cafe banao + owner login banao'};
  try{
    if((await fdb.ref('restaurants/'+id+'/config').once('value')).exists()){done();return alert('Ye short-id pehle se hai, dusra likho')}
    const cp=$('#rcp').value;let menu=JSON.stringify(DEF);
    if(cp==='-')menu=JSON.stringify([{n:'Masala Chai',p:30,e:'☕',c:'Drinks',v:true,o:false}]);
    else if(cp){const v=(await fdb.ref('restaurants/'+cp+'/menu').once('value')).val();if(v&&JSON.parse(v).length)menu=v}
    const st=await mkOwner(email,pw);
    if(st==='exists'&&!(await cfm(email+' ka login pehle se bana hua hai. Owner apna purana password use karega.\n\n⚠ Agar ye account owner ne khud nahi banaya, to Cancel karke dusra email do. Aage badhein?'))){done();return}
    const up={};up['restaurants/'+id+'/config']={name,tag:'',color:'#2e8b3d',gst:5,offer:'',upi:'',tables:20,wa:'',grev:''};up['restaurants/'+id+'/menu']=menu;up['restaurants/'+id+'/owner']=email;if(st==='new')up['restaurants/'+id+'/ownerUid']=NEWUID;up['index/'+id]=name;up['owners/'+ekey(email)+'/'+id]=name;
    await fdb.ref().update(up);done();await superPanel();shareLogin(name,email,pw,st==='exists');
  }catch(e){done();authErr(e)}
}
async function ownLogin(k){const email=SO[k];if(!email)return alert('Pehle owner email set karo (✉ Owner badlo)');
  const pw=await ask('Naya login banane ke liye '+email+' ka password likho (6+ characters).\nAgar account pehle se hai to reset link email pe jayega.','');if(pw==null)return;
  try{if(pw.length>=6){const st=await mkOwner(email,pw);if(st==='new'){await fdb.ref('restaurants/'+k+'/ownerUid').set(NEWUID);return shareLogin(SL[k],email,pw,false)}}
    if(await cfm(email+' ka account pehle se hai. Password reset link us email pe bhejein?')){await firebase.auth().sendPasswordResetEmail(email);alert('Reset link bhej diya. Owner apna email check kare (Spam bhi).')}
  }catch(e){authErr(e)}}
async function chOwner(k){const old=SO[k]||'',e=((await ask('Naya owner email:',old))||'').trim().toLowerCase();if(!e||e===old)return;if(!/^\S+@\S+\.\S+$/.test(e))return alert('Email sahi nahi hai');
  const up={};up['restaurants/'+k+'/owner']=e;up['restaurants/'+k+'/ownerUid']=null;up['owners/'+ekey(e)+'/'+k]=SL[k];if(old)up['owners/'+ekey(old)+'/'+k]=null;
  try{await fdb.ref().update(up);await superPanel();if(await cfm('Owner badal gaya ✅ Ab '+e+' ka login banayein?'))ownLogin(k)}catch(x){alert('Error: '+(x.code||x.message))}}
async function delCafe(k){if(((await ask('Pakka delete? Saare orders aur menu hamesha ke liye chale jayenge.\nConfirm ke liye short-id likho: '+k))||'').trim().toLowerCase()!==k.toLowerCase())return;
  const up={};up['restaurants/'+k]=null;up['index/'+k]=null;if(SO[k])up['owners/'+ekey(SO[k])+'/'+k]=null;
  try{await fdb.ref().update(up);toast('Delete ho gaya');superPanel()}catch(e){alert('Error: '+(e.code||e.message))}}
init();
</script></body></html>
