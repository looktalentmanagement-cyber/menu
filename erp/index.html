<body>
<header id="hdr"><h1>LedgerOne</h1></header>
<main id="main"><div class="empty">Loading...</div></main>
<nav id="tabs"></nav>
<div id="ov"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lock"></div>
<div id="print"></div>
<script>
'use strict';
/* ================= IndexedDB helper ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('erp-db', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['items', 'parties', 'vouchers'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = DB.db.transaction(store, mode); const st = tx.objectStore(store);
      const r = fn(st); let out;
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all(s) { return DB._req(s, 'readonly', st => st.getAll()); },
  get(s, k) { return DB._req(s, 'readonly', st => st.get(k)); },
  put(s, v, k) { return DB._req(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)); },
  del(s, k) { return DB._req(s, 'readwrite', st => st.delete(k)); },
  clear(s) { return DB._req(s, 'readwrite', st => st.clear()); },
  bulk(s, arr) { return DB._req(s, 'readwrite', st => { arr.forEach(v => st.put(v)); return null; }); }
};

/* ================= State ================= */
const APP = 'LedgerOne', APP_SUB = 'Billing • GST • Accounts', APP_VER = '3.0';
const S = { settings: null, items: [], parties: [], vouchers: [] };
const DEF_CO = () => ({ name: '', address: '', city: '', pin: '', gstin: '', state: '27', phone: '', email: '', prefix: 'INV-', ngPrefix: 'BL-', logo: '', bank: '', terms: 'Goods once sold will not be taken back.', openCash: 0, taxMode: 'regular', compRate: 1, fyNum: true, lut: false, lutNo: '', lutDate: '', turnover: 0, signatory: '' });
const DEF_SETTINGS = () => ({ setupDone: false, company: DEF_CO(), pin: '', counters: {} });
let CACHE = null;
function dirty() { CACHE = null; }
function upgradeSettings(s) {
  s = s || DEF_SETTINGS(); const c = s.company || {};
  if (s.setupDone && c.fyNum === undefined) c.fyNum = false; // existing businesses keep their current invoice series
  s.company = { ...DEF_CO(), ...c }; if (!s.counters) s.counters = {};
  return s;
}
async function loadAll() {
  S.settings = upgradeSettings(await DB.get('kv', 'settings'));
  S.items = await DB.all('items'); S.parties = await DB.all('parties'); S.vouchers = await DB.all('vouchers');
  dirty();
}
async function saveSettings() { S.settings.updatedAt = Date.now(); await DB.put('kv', S.settings, 'settings'); clPushSettings(); }
async function saveRec(store, rec) {
  if (!canSave(store, rec)) { denyToast(); throw new Error('role'); }
  rec.updatedAt = Date.now(); if (!rec.createdAt) rec.createdAt = rec.updatedAt;
  await DB.put(store, rec);
  const arr = S[store]; const i = arr.findIndex(x => x.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  dirty(); clPushRec(store, rec);
}
async function delRec(store, id) { if (clOn() && !can('delete')) { denyToast(); throw new Error('role'); } await DB.del(store, id); S[store] = S[store].filter(x => x.id !== id); dirty(); clPushDel(store, id); }
const item = id => S.items.find(x => x.id === id);
const party = id => S.parties.find(x => x.id === id);
const vch = id => S.vouchers.find(x => x.id === id);
const co = () => S.settings.company;

/* ================= Utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NQ = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 3 });
const r2 = n => Math.round((+n || 0) * 100 + Number.EPSILON * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const inr = n => { n = r2(n); return (n < 0 ? '-₹' : '₹') + NF.format(Math.abs(n)); };
const nfa = n => NF.format(r2(n));
const qf = n => NQ.format(+n || 0);
const short = n => { const a = Math.abs(n), s = n < 0 ? '-' : ''; if (a >= 1e7) return s + (a / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr'; if (a >= 1e5) return s + (a / 1e5).toFixed(1).replace(/\.0$/, '') + 'L'; if (a >= 1e3) return s + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k'; return s + Math.round(a); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };

      const snap = await base.child(col).once('value'); const remote = snap.val() || {};
      if (c.uploadLocal !== false) {
        if (col === 'settings') { const r = remote.main; if (S.settings.setupDone && (!r || (S.settings.updatedAt || 0) > r.updatedAt)) { if (!S.settings.updatedAt) S.settings.updatedAt = Date.now(); await DB.put('kv', S.settings, 'settings'); CL.q['settings/main'] = settingsPayload(); } }
        else S[col].forEach(rec => { const r = remote[rec.id]; if (!rec.updatedAt) rec.updatedAt = Date.now(); if (!r || rec.updatedAt > r.updatedAt) CL.q[col + '/' + rec.id] = { updatedAt: rec.updatedAt, j: JSON.stringify(rec) }; });
      }
      for (const [id, val] of Object.entries(remote)) await applyRemote(col, id, val);
    }
    await clSaveQ(); c.inited = true; delete c.uploadLocal; CL.denied = false; await clSaveCfg(); return true;
  } catch (e) { if (isDenied(e)) CL.denied = true; else console.warn('init', e && e.code); clStatus(); return false; }
}
async function clRemoved() {
  clDetach(); try { await CL.auth.signOut(); } catch (e) { }
  CL.cfg = null; CL.q = {}; CL.started = false; await DB.del('kv', 'cloud'); await clSaveQ();
  await ask('The Owner has removed you from the company. Cloud sync has stopped. (Local data on this phone is kept.)', { ok: 'OK', cancel: 'Close' });
  render();
}

/* ---------- Owner signup / login / logout ---------- */
function cloudSheet(mode) {
  const signup = mode === 'signup';
  sheet(signup ? 'Create Company (Owner)' : 'Cloud Login (Owner / Staff)', `
  ${signup ? `<div class="f"><label>Your Name</label><input id="cl_name" placeholder="e.g. Ramesh Sharma"></div>` : ''}
  <div class="f"><label>Email</label><input id="cl_email" type="email" autocomplete="username" placeholder="you@gmail.com"></div>
  <div class="f"><label>Password ${signup ? '(at least 6 characters)' : ''}</label><input id="cl_pw" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}"></div>
  <p class="mu" style="font-size:12.5px;margin:0">${signup ? 'A new company will be created and all data on this phone will be uploaded to the cloud. You can then add staff.' : 'Owner or staff — enter the email and password you were given.'}</p>
  <div id="cl_err" class="rd" style="font-size:13px;margin-top:8px"></div>`,
    `<button class="btn full" id="cl_go">${signup ? 'Create Company' : 'Log In'}</button>`);
  $('#cl_go').onclick = () => signup ? clSignup() : clLogin();
}
function clErr(m) { const e = $('#cl_err'); if (e) e.textContent = m; else toast(m); }
async function clSignup() {
  const name = $('#cl_name').value.trim(), email = $('#cl_email').value.trim().toLowerCase(), pw = $('#cl_pw').value;
  if (!email || !pw) return clErr('Enter both email and password'); if (pw.length < 6) return clErr('Password must be at least 6 characters');
  const btn = $('#cl_go'); btn.disabled = true; btn.textContent = 'Please wait...';
  try { await loadFB(); CL.sdk = 'ok'; } catch (e) { btn.disabled = false; btn.textContent = 'Create Company'; return clErr('No internet connection. Connect and try again.'); }
  fbInit();
  let cred; try { cred = await CL.auth.createUserWithEmailAndPassword(email, pw); } catch (e) { btn.disabled = false; btn.textContent = 'Create Company'; return clErr(authMsg(e)); }
  CL.cfg = { cid: 'c' + uid(), uid: cred.user.uid, email, name, role: 'owner', company: co().name || '', pendingCreate: true, inited: false };
  await clSaveCfg(); CL.user = cred.user; closeOv();
  await clStart(); await clAttach();
  toast(CL.denied ? 'Account created. Sync will start once the rules are published.' : 'Company created ✓ Uploading data');
  render();
}
async function clLogin() {
  const email = $('#cl_email').value.trim().toLowerCase(), pw = $('#cl_pw').value;
  if (!email || !pw) return clErr('Enter both email and password');
  const btn = $('#cl_go'); btn.disabled = true; btn.textContent = 'Please wait...';
  const reset = m => { btn.disabled = false; btn.textContent = 'Log In'; clErr(m); };
  try { await loadFB(); CL.sdk = 'ok'; } catch (e) { return reset('No internet connection. Connect and try again.'); }
  fbInit();
  let cred; try { cred = await CL.auth.signInWithEmailAndPassword(email, pw); } catch (e) { return reset(authMsg(e)); }
  const u = cred.user;
  try {
    const cid = (await CL.db.ref(`erpUsers/${u.uid}`).once('value')).val();
    if (!cid) { await CL.auth.signOut(); return reset('This account is not part of any company. Ask the Owner to add you as staff.'); }
    const m = (await CL.db.ref(`erp/${cid}/members/${u.uid}`).once('value')).val();
    if (!m) { await CL.auth.signOut(); return reset('You have been removed from the company.'); }
    let company = ''; try { company = ((await CL.db.ref(`erp/${cid}/info`).once('value')).val() || {}).name || ''; } catch (e) { }
    const hasLocal = S.items.length + S.parties.length + S.vouchers.length > 0;
    let uploadLocal = true;
    if (hasLocal && m.role !== 'owner') {
      closeOv();
      const replace = await ask(`This phone already has data (${S.items.length} items, ${S.parties.length} parties, ${S.vouchers.length} entries). Remove local data before loading <b>${esc(company || 'Company')}</b> cloud data?<br><br><b>Remove</b> = delete local data, keep only company data<br><b>Merge</b> = local data will be added to the company`, { ok: 'Remove', cancel: 'Merge' });
      if (replace) { for (const s of SYNC_COLS) await DB.clear(s); const pin = S.settings.pin; S.settings = { ...DEF_SETTINGS(), pin }; await DB.put('kv', S.settings, 'settings'); await loadAll(); uploadLocal = false; }
    }
    CL.cfg = { cid, uid: u.uid, email, name: m.name || '', role: m.role, company, inited: false, uploadLocal };
    await clSaveCfg(); CL.user = u; CL.denied = false; closeOv();
    await clStart(); await clAttach();
    toast(`Logged in ✓ ${ROLES[m.role] || m.role}`); render();
  } catch (e) {
    if (isDenied(e)) { CL.denied = true; try { await CL.auth.signOut(); } catch (x) { } return reset('Cloud rules are not published yet. The Owner must publish the rules in the Firebase console, then log in again.'); }
    return reset(authMsg(e));
  }
}
async function clLogout() {
  const n = Object.keys(CL.q).length;
  if (!(await ask(`Log out of the cloud?${n ? `<br><br>⚠️ ${n} entries have not reached the cloud yet — they will stay only on this phone.` : ''}<br>Local data on this phone is kept.`, { ok: 'Logout', danger: !!n }))) return;
  clDetach(); try { if (CL.auth) await CL.auth.signOut(); } catch (e) { }
  CL.cfg = null; CL.q = {}; CL.tombs = {}; CL.started = false; CL.denied = false; CL.user = null; CL.connected = false;
  await DB.del('kv', 'cloud'); await clSaveQ(); await clSaveTombs(); toast('Logged out'); render();
}
async function clRetry() { CL.denied = false; clStatus(); if (!CL.cfg) return; await clStart(); if (CL.user && CL.user.uid === CL.cfg.uid) await clAttach(); else clStatus(); if (CL.denied) toast('Rules are still not published'); else toast('Retried'); }

/* ---------- Staff management (owner) ---------- */
let STAFF = null;
async function loadStaff() {
  const el = $('#staffList'); if (!el) return;
  if (!CL.db || !CL.user) { el.innerHTML = '<div class="mu" style="font-size:13px">Internet is needed to load the staff list.</div>'; return; }
  try {
    const m = (await CL.db.ref(`erp/${CL.cfg.cid}/members`).once('value')).val() || {}; STAFF = m;
    el.innerHTML = Object.entries(m).sort((a, b) => (a[1].role === 'owner' ? -1 : 0) - (b[1].role === 'owner' ? -1 : 0)).map(([id, x]) => `<div class="row" ${x.role === 'owner' ? 'style="cursor:default"' : `onclick="staffEdit('${id}')"`}><div class="av">${esc(initials(x.name || x.email))}</div><div class="m"><div class="t">${esc(x.name || x.email)}</div><div class="s">${esc(x.email)}</div></div><div class="rt"><span class="tag ${x.role === 'owner' ? 'g' : x.role === 'viewer' ? 'x' : ''}">${esc(ROLES[x.role] || x.role)}</span></div></div>`).join('');
  } catch (e) { el.innerHTML = `<div class="rd" style="font-size:13px">${isDenied(e) ? 'Rules not published — staff list unavailable.' : 'Could not load the staff list.'}</div>`; if (isDenied(e)) { CL.denied = true; clStatus(); } }
}
const roleOpts = sel => ['manager', 'billing', 'viewer'].map(r => `<option value="${r}" ${r === sel ? 'selected' : ''}>${ROLES[r]} — ${ROLE_INFO[r]}</option>`).join('');
function staffAdd() {
  if (!can('staff')) return denyToast();
  sheet('Add Staff', `<div class="f"><label>Name</label><input id="st_name" placeholder="e.g. Suresh"></div>
  <div class="f"><label>Email (for login)</label><input id="st_email" type="email" autocomplete="off"></div>
  <div class="f"><label>Password (at least 6 characters)</label><input id="st_pw" type="text" autocomplete="off"></div>
  <div class="f"><label>Role</label><select id="st_role">${roleOpts('billing')}</select></div>
  <p class="mu" style="font-size:12.5px;margin:0">Share this email and password with the staff member. They open LedgerOne on their phone and log in via Settings → Cloud Login.</p>
  <div id="cl_err" class="rd" style="font-size:13px;margin-top:8px"></div>`, `<button class="btn full" id="st_go">Add Staff</button>`);
  $('#st_go').onclick = async () => {
    const name = $('#st_name').value.trim(), email = $('#st_email').value.trim().toLowerCase(), pw = $('#st_pw').value, role = $('#st_role').value;
    if (!name || !email || !pw) return clErr('Enter name, email and password'); if (pw.length < 6) return clErr('Password must be at least 6 characters');
    if (!ROLES[role] || role === 'owner') return clErr('Select a role');
    const b = $('#st_go'); b.disabled = true; b.textContent = 'Please wait...';
    const fail = m => { b.disabled = false; b.textContent = 'Add Staff'; clErr(m); };
    let sec, suid;
    try {
      sec = (firebase.apps || []).find(a => a.name === 'erpsec') || firebase.initializeApp(FB_CFG, 'erpsec');
      try { await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) { }
      let cred;
      try { cred = await sec.auth().createUserWithEmailAndPassword(email, pw); }
      catch (e) { if (!String(e && e.code).includes('email-already-in-use')) throw e; try { cred = await sec.auth().signInWithEmailAndPassword(email, pw); } catch (x) { throw e; } }
      suid = cred.user.uid;
      try { await sec.auth().signOut(); } catch (e) { }
    } catch (e) { return fail(authMsg(e)); }
    try {
      await CL.db.ref().update({ [`erp/${CL.cfg.cid}/members/${suid}`]: { role, email, name }, [`erpUsers/${suid}`]: CL.cfg.cid });
    } catch (e) { if (isDenied(e)) { CL.denied = true; clStatus(); } return fail(isDenied(e) ? 'Could not add staff because the cloud rules are not published yet. Publish the rules and add again with the same email and password.' : authMsg(e)); }
    closeOv(); toast(`${name} added ✓ (${ROLES[role]})`); loadStaff();
  };
}
function staffEdit(id) {
  if (!can('staff')) return denyToast();
  const x = STAFF && STAFF[id]; if (!x || x.role === 'owner') return;
  sheet(esc(x.name || x.email), `<div class="kv"><span>Email</span><span>${esc(x.email)}</span></div>
  <div class="f" style="margin-top:10px"><label>Change role</label><select id="se_role">${roleOpts(x.role)}</select></div><div id="cl_err" class="rd" style="font-size:13px"></div>`,
    `<div class="btns"><button class="btn dan" id="se_del">Remove</button><button class="btn" id="se_save">Save Role</button></div>`);
  $('#se_save').onclick = async () => { try { await CL.db.ref(`erp/${CL.cfg.cid}/members/${id}/role`).set($('#se_role').value); closeOv(); toast('Role updated ✓'); loadStaff(); } catch (e) { clErr(authMsg(e)); } };
  $('#se_del').onclick = async () => {
    closeOv(); if (!(await ask(`Remove ${esc(x.name || x.email)} from the company? Their cloud access stops immediately.`, { ok: 'Remove', danger: true }))) return;
    try { await CL.db.ref().update({ [`erp/${CL.cfg.cid}/members/${id}`]: null, [`erpUsers/${id}`]: null }); toast('Staff removed'); loadStaff(); } catch (e) { toast(authMsg(e)); }
  };
}

/* ---------- Settings card ---------- */
function cloudCardHTML() {
  const s = clState();
  const rules = `<div id="rulesMsg" class="card" style="display:${s.k === 'rules' ? 'block' : 'none'};background:var(--warnl);border:1px solid #fcd34d;margin:10px 0 0;padding:10px;font-size:13px">⚠️ <b>Cloud rules are not published yet.</b> Your data is safe on this phone and the app works normally. The Owner should publish the rules in the Firebase console — sync will then start automatically.<div style="margin-top:8px"><button class="btn sm sec" onclick="clRetry()">Try Again</button></div></div>`;
  if (!CL.cfg) return `<div class="card" id="cloudCard"><div class="kv"><span>☁️ Cloud Sync</span><span class="tag x" id="cloudStatus" data-k="off">OFF</span></div>
  <p class="mu" style="font-size:12.5px;margin:6px 0 10px">Optional. Turn it on to back up data to the cloud, use it on several phones and give staff their own login. Without the cloud the app keeps working offline.</p>
  <div class="btns"><button class="btn" id="clSignupBtn" onclick="cloudSheet('signup')">Create Company (Owner)</button><button class="btn ghost" id="clLoginBtn" onclick="cloudSheet('login')">Login (Owner / Staff)</button></div></div>`;
  const c = CL.cfg;
  return `<div class="card" id="cloudCard"><div class="kv"><span>☁️ Status</span><span class="tag ${s.c}" id="cloudStatus" data-k="${s.k}">${esc(s.t)}</span></div>
  <div class="kv"><span>Company</span><b>${esc(co().name || c.company || '—')}</b></div>
  <div class="kv"><span>Login</span><span>${esc(c.email)}</span></div>
  <div class="kv"><span>Your Role</span><b id="myRole">${esc(ROLES[c.role] || c.role)}</b></div>
  ${rules}
  <div class="btns" style="margin-top:10px"><button class="btn sec sm" onclick="clRetry()">🔄 Sync Now</button>${s.k === 'login' ? `<button class="btn sm" onclick="cloudSheet('login')">Log In</button>` : ''}<button class="btn ghost sm" id="clLogout" onclick="clLogout()">Logout</button></div></div>
  ${c.role === 'owner' ? `<div class="sect">Staff (Team)</div><div class="card"><div class="list" id="staffList" style="margin:0 0 10px"><div class="mu" style="font-size:13px">Loading...</div></div><button class="btn full" id="staffAddBtn" onclick="staffAdd()">+ Add Staff</button>
  <p class="mu" style="font-size:12px;margin:8px 0 0">Roles: Manager = ${ROLE_INFO.manager}. Billing = ${ROLE_INFO.billing}. Viewer = ${ROLE_INFO.viewer}.</p></div>` : ''}`;
}
async function clBoot() {
  CL.cfg = (await DB.get('kv', 'cloud')) || null;
  CL.q = (await DB.get('kv', 'syncq')) || {};
  CL.tombs = (await DB.get('kv', 'tombs')) || {};
  if (CL.cfg) clStart();
}

/* ================= Boot ================= */
let HIDDEN_AT = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) HIDDEN_AT = Date.now(); else if (S.settings && S.settings.pin && HIDDEN_AT && Date.now() - HIDDEN_AT > 120000 && !$('#lock').classList.contains('on')) lockScreen('unlock'); });
(async function boot() {
  try { await DB.open(); await loadAll(); await clBoot(); }
  catch (e) { $('#main').innerHTML = emptyBox('⚠️', 'Storage could not be opened', 'If the browser is in private mode, open the app in normal mode.'); return; }
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/home');
  trackNav();
  if (S.settings.pin) lockScreen('unlock');
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => { });
})();

</script>
