<body>
<header id="hdr"><h1>Business ERP</h1></header>
<main id="main"><div class="empty">Loading...</div></main>
<nav id="tabs"></nav>
<div id="ov"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lock"></div>
<div id="print"></div>
<script>
'use strict';
/* ================= IndexedDB helper ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('erp-db', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['items', 'parties', 'vouchers'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = DB.db.transaction(store, mode); const st = tx.objectStore(store);
      const r = fn(st); let out;
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all(s) { return DB._req(s, 'readonly', st => st.getAll()); },
  get(s, k) { return DB._req(s, 'readonly', st => st.get(k)); },
  put(s, v, k) { return DB._req(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)); },
  del(s, k) { return DB._req(s, 'readwrite', st => st.delete(k)); },
  clear(s) { return DB._req(s, 'readwrite', st => st.clear()); },
  bulk(s, arr) { return DB._req(s, 'readwrite', st => { arr.forEach(v => st.put(v)); return null; }); }
};

/* ================= State ================= */
const S = { settings: null, items: [], parties: [], vouchers: [] };
const DEF_SETTINGS = () => ({ setupDone: false, company: { name: '', address: '', gstin: '', state: '27', phone: '', email: '', prefix: 'INV-', logo: '', bank: '', terms: 'Goods once sold will not be taken back.', openCash: 0 }, pin: '', counters: {} });
let CACHE = null;
function dirty() { CACHE = null; }
async function loadAll() {
  S.settings = (await DB.get('kv', 'settings')) || DEF_SETTINGS();
  S.items = await DB.all('items'); S.parties = await DB.all('parties'); S.vouchers = await DB.all('vouchers');
  dirty();
}
async function saveSettings() { S.settings.updatedAt = Date.now(); await DB.put('kv', S.settings, 'settings'); clPushSettings(); }
async function saveRec(store, rec) {
  if (!canSave(store, rec)) { denyToast(); throw new Error('role'); }
  rec.updatedAt = Date.now(); if (!rec.createdAt) rec.createdAt = rec.updatedAt;
  await DB.put(store, rec);
  const arr = S[store]; const i = arr.findIndex(x => x.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  dirty(); clPushRec(store, rec);
}
async function delRec(store, id) { if (clOn() && !can('delete')) { denyToast(); throw new Error('role'); } await DB.del(store, id); S[store] = S[store].filter(x => x.id !== id); dirty(); clPushDel(store, id); }
const item = id => S.items.find(x => x.id === id);
const party = id => S.parties.find(x => x.id === id);
const vch = id => S.vouchers.find(x => x.id === id);
const co = () => S.settings.company;

/* ================= Utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NQ = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 3 });
const r2 = n => Math.round((+n || 0) * 100 + Number.EPSILON * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const inr = n => { n = r2(n); return (n < 0 ? '-₹' : '₹') + NF.format(Math.abs(n)); };
const nfa = n => NF.format(r2(n));
const qf = n => NQ.format(+n || 0);
const short = n => { const a = Math.abs(n), s = n < 0 ? '-' : ''; if (a >= 1e7) return s + (a / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr'; if (a >= 1e5) return s + (a / 1e5).toFixed(1).replace(/\.0$/, '') + 'L'; if (a >= 1e3) return s + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k'; return s + Math.round(a); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fd = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d} ${MON[+m - 1]} ${y}`; };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const monthStart = (s = today()) => s.slice(0, 8) + '01';
const initials = s => (s || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  bill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>',

/* ================= Computation ================= */
function compute() {
  if (CACHE) return CACHE;
  const stock = new Map(), bal = new Map();
  S.items.forEach(i => stock.set(i.id, num(i.openStock)));
  S.parties.forEach(p => bal.set(p.id, num(p.openBal)));
  let cash = num(co().openCash), bank = 0;
  for (const v of S.vouchers) {
    const t = VT[v.type]; if (!t) continue;
    if (t.lines && t.stock) for (const l of v.lines) stock.set(l.itemId, (stock.get(l.itemId) || 0) + t.stock * num(l.qty));
    if (v.type === 'prod') {
      stock.set(v.outItem, (stock.get(v.outItem) || 0) + num(v.outQty));
      for (const l of v.lines || []) stock.set(l.itemId, (stock.get(l.itemId) || 0) - num(l.qty));
    }
    if (t.party && v.partyId) bal.set(v.partyId, (bal.get(v.partyId) || 0) + t.party * num(v.type === 'payin' || v.type === 'payout' ? v.amount : v.total));
    // money movement
    let inflow = 0;
    if (v.type === 'payin') inflow = num(v.amount);
    else if (v.type === 'payout' || v.type === 'exp') inflow = -num(v.amount);
    else if (v.type === 'sale' && num(v.paid)) { inflow = num(v.paid); if (v.partyId) bal.set(v.partyId, bal.get(v.partyId) - num(v.paid)); }
    else if (v.type === 'purchase' && num(v.paid)) { inflow = -num(v.paid); if (v.partyId) bal.set(v.partyId, bal.get(v.partyId) + num(v.paid)); }
    else if (v.type === 'sret' && num(v.paid)) { inflow = -num(v.paid); if (v.partyId) bal.set(v.partyId, bal.get(v.partyId) + num(v.paid)); }
    else if (v.type === 'pret' && num(v.paid)) { inflow = num(v.paid); if (v.partyId) bal.set(v.partyId, bal.get(v.partyId) - num(v.paid)); }
    if (inflow) { if ((v.mode || 'Cash') === 'Cash') cash += inflow; else bank += inflow; }
  }
  let recv = 0, pay = 0; bal.forEach(b => { if (b > 0.004) recv += b; else if (b < -0.004) pay -= b; });
  const low = S.items.filter(i => num(i.lowStock) > 0 && (stock.get(i.id) || 0) <= num(i.lowStock));
  CACHE = { stock, bal, cash: r2(cash), bank: r2(bank), recv: r2(recv), pay: r2(pay), low };
  return CACHE;
}
// stock of item as on date (inclusive)
function stockAsOf(itemId, date) {
  const it = item(itemId); let s = num(it && it.openStock);
  for (const v of S.vouchers) {
    if (v.date > date) continue; const t = VT[v.type];
    if (t.lines && t.stock) for (const l of v.lines) if (l.itemId === itemId) s += t.stock * num(l.qty);
    if (v.type === 'prod') { if (v.outItem === itemId) s += num(v.outQty); for (const l of v.lines || []) if (l.itemId === itemId) s -= num(l.qty); }
  }
  return s;
}
// signed money value of voucher for day book: + inflow / - outflow (cash+bank)
function vAmount(v) { return num(v.lines ? v.total : v.type === 'prod' ? 0 : v.amount); }
function vParty(v) { const p = v.partyId && party(v.partyId); return p ? p.name : (v.type === 'exp' ? (v.category || 'Kharcha') : v.type === 'prod' ? ((item(v.outItem) || {}).name || '') : (v.lines ? (v.walkName || 'Walk-in / Cash') : '')); }

/* Line + total calc */
function calcVoucher(v) {
  const p = v.partyId && party(v.partyId);
  const ps = (p && p.state) || co().state;
  v.inter = !!(ps && co().state && ps !== co().state);
  let taxable = 0, tax = 0, gross = 0, disc = 0;
  for (const l of v.lines) {
    const amt = num(l.qty) * num(l.rate); const d = amt * num(l.disc) / 100;
    l.taxable = r2(amt - d); l.tax = r2(l.taxable * num(l.gst) / 100); l.amount = r2(l.taxable + l.tax);
    gross += amt; disc += d; taxable += l.taxable; tax += l.tax;
  }
  v.gross = r2(gross); v.discount = r2(disc); v.taxable = r2(taxable); tax = r2(tax);
  if (v.inter) { v.igst = tax; v.cgst = 0; v.sgst = 0; } else { v.cgst = r2(tax / 2); v.sgst = r2(tax - v.cgst); v.igst = 0; }
  const exact = r2(taxable + tax);
  v.total = v.noRound ? exact : Math.round(exact);
  v.roundOff = r2(v.total - exact);
  return v;
}

/* Amount in words (Indian) */
function inWords(n) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const conv = x => {
    if (x === 0) return '';
    const cr = Math.floor(x / 1e7), l = Math.floor(x / 1e5) % 100, th = Math.floor(x / 1000) % 100, r = x % 1000;
    return [cr ? conv(cr) + ' Crore' : '', l ? two(l) + ' Lakh' : '', th ? two(th) + ' Thousand' : '', r ? three(r) : ''].filter(Boolean).join(' ');
  };
  n = Math.abs(r2(n)); const rs = Math.floor(n), ps = Math.round((n - rs) * 100);
  let s = (conv(rs) || 'Zero') + ' Rupees'; if (ps) s += ' and ' + two(ps) + ' Paise';
  return s + ' Only';
}

async function stockWarn(needs, oldV) {

  const C = compute(); const short = [];
  needs.forEach((q, id) => {
    let avail = C.stock.get(id) || 0;
    if (oldV) { const t = VT[oldV.type]; if (t.lines && t.stock < 0) oldV.lines.forEach(l => { if (l.itemId === id) avail += num(l.qty); }); if (oldV.type === 'prod') (oldV.lines || []).forEach(l => { if (l.itemId === id) avail += num(l.qty); }); }
    if (q > avail + 1e-9) { const it = item(id); short.push(`${esc(it ? it.name : '?')} (hai: ${qf(avail)}, chahiye: ${qf(q)})`); }
  });
  if (!short.length) return true;
  return ask(`Stock kam hai:<br><br>${short.join('<br>')}<br><br>Phir bhi save karein? Stock minus mein chala jayega.`, { ok: 'Haan, Save', cancel: 'Ruko' });

async function saveVoucher() {

  if (!v.partyId && !(v.type === 'sale' || v.type === 'quote')) return toast('Party chunein');
  v.lines = v.lines.filter(l => num(l.qty) > 0);
  if (!v.lines.length) { drawVForm(); return toast('Kam se kam ek item jodein (qty > 0)'); }
  calcVoucher(v);
  if (v.type === 'sale' && !v.partyId) v.paid = v.total;
  if (v.type === 'quote') v.paid = 0;

async function hashPin(p) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('erp:' + p)); return 'h:' + Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return 'p:' + p; } }

}

  const m = LOCK.mode; const title = m === 'unlock' ? 'PIN daalein' : m === 'set1' ? 'Naya 4-digit PIN' : 'PIN dobara daalein';
  $('#lock').innerHTML = `<div style="font-size:15px;opacity:.85">${esc(co().name || 'Business ERP')}</div><div style="font-size:21px;font-weight:700">${title}</div><div style="min-height:20px;font-size:13px;color:#fecaca">${msg || ''}</div>
  <div class="dots" id="ldots">${[0, 1, 2, 3].map(i => `<i class="${i < LOCK.buf.length ? 'f' : ''}"></i>`).join('')}</div>
  <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="pinKey('${n}')">${n}</button>`).join('')}${m === 'unlock' ? '<span></span>' : `<button onclick="pinCancel()" style="font-size:14px">Cancel</button>`}<button onclick="pinKey('0')">0</button><button onclick="pinKey('del')" aria-label="Delete">⌫</button></div>`;

  if (LOCK.buf.length >= 4) return; LOCK.buf += k; drawLock(); if (LOCK.buf.length < 4) return;
  const m = LOCK.mode, p = LOCK.buf;
  if (m === 'unlock') { if ((await hashPin(p)) === S.settings.pin) { $('#lock').classList.remove('on'); $('#lock').innerHTML = ''; } else { LOCK.buf = ''; drawLock('Galat PIN'); $('#ldots').classList.add('shake'); } return; }
  if (m === 'set1') { LOCK.first = p; LOCK.buf = ''; LOCK.mode = 'set2'; return setTimeout(() => drawLock(), 120); }
  if (m === 'set2') { if (p !== LOCK.first) { LOCK = { mode: 'set1', buf: '', first: '' }; return drawLock('Dono PIN alag the, phir se try karein'); } S.settings.pin = await hashPin(p); await saveSettings(); pinCancel(); toast('PIN lag gaya 🔒'); render(); }
}

}
async function clRemoved() {
  clDetach(); try { await CL.auth.signOut(); } catch (e) { }
  CL.cfg = null; CL.q = {}; CL.started = false; await DB.del('kv', 'cloud'); await clSaveQ();
  await ask('Owner ne aapko company se hata diya hai. Cloud sync band ho gaya. (Phone ka local data abhi bhi hai)', { ok: 'Theek hai', cancel: 'Band karein' });
  render();
}

/* ---------- Owner signup / login / logout ---------- */
function cloudSheet(mode) {
  const signup = mode === 'signup';
  sheet(signup ? 'Company Banayein (Owner)' : 'Cloud Login (Owner / Staff)', `
  ${signup ? `<div class="f"><label>Aapka Naam</label><input id="cl_name" placeholder="e.g. Ramesh Sharma"></div>` : ''}
  <div class="f"><label>Email</label><input id="cl_email" type="email" autocomplete="username" placeholder="aap@gmail.com"></div>
  <div class="f"><label>Password ${signup ? '(kam se kam 6 akshar)' : ''}</label><input id="cl_pw" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}"></div>
  <p class="mu" style="font-size:12.5px;margin:0">${signup ? 'Ek nayi company banegi aur is phone ka saara data cloud par upload ho jayega. Phir aap staff jod sakte hain.' : 'Owner ya staff — jo email/password aapko mila hai wahi daalein.'}</p>
  <div id="cl_err" class="rd" style="font-size:13px;margin-top:8px"></div>`,
    `<button class="btn full" id="cl_go">${signup ? 'Company Banayein' : 'Login Karein'}</button>`);
  $('#cl_go').onclick = () => signup ? clSignup() : clLogin();
}
function clErr(m) { const e = $('#cl_err'); if (e) e.textContent = m; else toast(m); }
async function clSignup() {
  const name = $('#cl_name').value.trim(), email = $('#cl_email').value.trim().toLowerCase(), pw = $('#cl_pw').value;
  if (!email || !pw) return clErr('Email aur password dono daalein'); if (pw.length < 6) return clErr('Password kam se kam 6 akshar ka rakhein');
  const btn = $('#cl_go'); btn.disabled = true; btn.textContent = 'Ruk jaiye...';
  try { await loadFB(); CL.sdk = 'ok'; } catch (e) { btn.disabled = false; btn.textContent = 'Company Banayein'; return clErr('Internet nahi hai. Net on karke try karein.'); }
  fbInit();
  let cred; try { cred = await CL.auth.createUserWithEmailAndPassword(email, pw); } catch (e) { btn.disabled = false; btn.textContent = 'Company Banayein'; return clErr(authMsg(e)); }
  CL.cfg = { cid: 'c' + uid(), uid: cred.user.uid, email, name, role: 'owner', company: co().name || '', pendingCreate: true, inited: false };
  await clSaveCfg(); CL.user = cred.user; closeOv();
  await clStart(); await clAttach();
  toast(CL.denied ? 'Account ban gaya. Rules publish hone ke baad sync shuru hoga.' : 'Company ban gayi ✓ Data upload ho raha hai');
  render();
}
async function clLogin() {
  const email = $('#cl_email').value.trim().toLowerCase(), pw = $('#cl_pw').value;
  if (!email || !pw) return clErr('Email aur password dono daalein');
  const btn = $('#cl_go'); btn.disabled = true; btn.textContent = 'Ruk jaiye...';
  const reset = m => { btn.disabled = false; btn.textContent = 'Login Karein'; clErr(m); };
  try { await loadFB(); CL.sdk = 'ok'; } catch (e) { return reset('Internet nahi hai. Net on karke try karein.'); }
  fbInit();
  let cred; try { cred = await CL.auth.signInWithEmailAndPassword(email, pw); } catch (e) { return reset(authMsg(e)); }
  const u = cred.user;
  try {
    const cid = (await CL.db.ref(`erpUsers/${u.uid}`).once('value')).val();
    if (!cid) { await CL.auth.signOut(); return reset('Ye account kisi company mein add nahi hai. Owner se kahiye aapko Staff mein jode.'); }
    const m = (await CL.db.ref(`erp/${cid}/members/${u.uid}`).once('value')).val();
    if (!m) { await CL.auth.signOut(); return reset('Aapko company se hata diya gaya hai.'); }
    let company = ''; try { company = ((await CL.db.ref(`erp/${cid}/info`).once('value')).val() || {}).name || ''; } catch (e) { }
    const hasLocal = S.items.length + S.parties.length + S.vouchers.length > 0;
    let uploadLocal = true;
    if (hasLocal && m.role !== 'owner') {
      closeOv();
      const replace = await ask(`Is phone par pehle se data hai (${S.items.length} items, ${S.parties.length} parties, ${S.vouchers.length} entries). <b>${esc(company || 'Company')}</b> ka cloud data aane se pehle local data hata dein?<br><br><b>Haan</b> = local hatao, sirf company ka data rakho<br><b>Nahi</b> = local data bhi company mein jud jayega`, { ok: 'Haan, hatao', cancel: 'Nahi, jodo' });
      if (replace) { for (const s of SYNC_COLS) await DB.clear(s); const pin = S.settings.pin; S.settings = { ...DEF_SETTINGS(), pin }; await DB.put('kv', S.settings, 'settings'); await loadAll(); uploadLocal = false; }
    }
    CL.cfg = { cid, uid: u.uid, email, name: m.name || '', role: m.role, company, inited: false, uploadLocal };
    await clSaveCfg(); CL.user = u; CL.denied = false; closeOv();
    await clStart(); await clAttach();
    toast(`Login ho gaya ✓ ${ROLES[m.role] || m.role}`); render();
  } catch (e) {
    if (isDenied(e)) { CL.denied = true; try { await CL.auth.signOut(); } catch (x) { } return reset('Cloud rules abhi publish nahi hui. Owner Firebase console mein rules publish kare, phir login karein.'); }
    return reset(authMsg(e));
  }
}
async function clLogout() {
  const n = Object.keys(CL.q).length;
  if (!(await ask(`Cloud se logout karna hai?${n ? `<br><br>⚠️ ${n} entries abhi cloud par nahi gayi hain — wo sirf is phone par rahengi.` : ''}<br>Phone ka local data rahega.`, { ok: 'Logout', danger: !!n }))) return;
  clDetach(); try { if (CL.auth) await CL.auth.signOut(); } catch (e) { }
  CL.cfg = null; CL.q = {}; CL.tombs = {}; CL.started = false; CL.denied = false; CL.user = null; CL.connected = false;
  await DB.del('kv', 'cloud'); await clSaveQ(); await clSaveTombs(); toast('Logout ho gaya'); render();
}
async function clRetry() { CL.denied = false; clStatus(); if (!CL.cfg) return; await clStart(); if (CL.user && CL.user.uid === CL.cfg.uid) await clAttach(); else clStatus(); if (CL.denied) toast('Rules abhi bhi publish nahi hui'); else toast('Dobara try kiya'); }

/* ---------- Staff management (owner) ---------- */
let STAFF = null;
async function loadStaff() {
  const el = $('#staffList'); if (!el) return;
  if (!CL.db || !CL.user) { el.innerHTML = '<div class="mu" style="font-size:13px">Staff list ke liye internet chahiye.</div>'; return; }
  try {
    const m = (await CL.db.ref(`erp/${CL.cfg.cid}/members`).once('value')).val() || {}; STAFF = m;
    el.innerHTML = Object.entries(m).sort((a, b) => (a[1].role === 'owner' ? -1 : 0) - (b[1].role === 'owner' ? -1 : 0)).map(([id, x]) => `<div class="row" ${x.role === 'owner' ? 'style="cursor:default"' : `onclick="staffEdit('${id}')"`}><div class="av">${esc(initials(x.name || x.email))}</div><div class="m"><div class="t">${esc(x.name || x.email)}</div><div class="s">${esc(x.email)}</div></div><div class="rt"><span class="tag ${x.role === 'owner' ? 'g' : x.role === 'viewer' ? 'x' : ''}">${esc(ROLES[x.role] || x.role)}</span></div></div>`).join('');
  } catch (e) { el.innerHTML = `<div class="rd" style="font-size:13px">${isDenied(e) ? 'Rules publish nahi hui — staff list nahi dikh sakti.' : 'Staff list load nahi hui.'}</div>`; if (isDenied(e)) { CL.denied = true; clStatus(); } }
}
const roleOpts = sel => ['manager', 'billing', 'viewer'].map(r => `<option value="${r}" ${r === sel ? 'selected' : ''}>${ROLES[r]} — ${ROLE_INFO[r]}</option>`).join('');
function staffAdd() {
  if (!can('staff')) return denyToast();
  sheet('Naya Staff Jodein', `<div class="f"><label>Naam</label><input id="st_name" placeholder="e.g. Suresh"></div>
  <div class="f"><label>Email (login ke liye)</label><input id="st_email" type="email" autocomplete="off"></div>
  <div class="f"><label>Password (kam se kam 6 akshar)</label><input id="st_pw" type="text" autocomplete="off"></div>
  <div class="f"><label>Role</label><select id="st_role">${roleOpts('billing')}</select></div>
  <p class="mu" style="font-size:12.5px;margin:0">Ye email/password staff ko de dein. Wo apne phone par ERP kholkar Settings → Cloud Login se login karenge.</p>
  <div id="cl_err" class="rd" style="font-size:13px;margin-top:8px"></div>`, `<button class="btn full" id="st_go">Staff Jodein</button>`);
  $('#st_go').onclick = async () => {
    const name = $('#st_name').value.trim(), email = $('#st_email').value.trim().toLowerCase(), pw = $('#st_pw').value, role = $('#st_role').value;
    if (!name || !email || !pw) return clErr('Naam, email aur password teeno daalein'); if (pw.length < 6) return clErr('Password kam se kam 6 akshar ka rakhein');
    if (!ROLES[role] || role === 'owner') return clErr('Role chunein');
    const b = $('#st_go'); b.disabled = true; b.textContent = 'Ruk jaiye...';
    const fail = m => { b.disabled = false; b.textContent = 'Staff Jodein'; clErr(m); };
    let sec, suid;
    try {
      sec = (firebase.apps || []).find(a => a.name === 'erpsec') || firebase.initializeApp(FB_CFG, 'erpsec');
      try { await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) { }
      let cred;
      try { cred = await sec.auth().createUserWithEmailAndPassword(email, pw); }
      catch (e) { if (!String(e && e.code).includes('email-already-in-use')) throw e; try { cred = await sec.auth().signInWithEmailAndPassword(email, pw); } catch (x) { throw e; } }
      suid = cred.user.uid;
      try { await sec.auth().signOut(); } catch (e) { }
    } catch (e) { return fail(authMsg(e)); }
    try {
      await CL.db.ref().update({ [`erp/${CL.cfg.cid}/members/${suid}`]: { role, email, name }, [`erpUsers/${suid}`]: CL.cfg.cid });
    } catch (e) { if (isDenied(e)) { CL.denied = true; clStatus(); } return fail(isDenied(e) ? 'Staff company mein nahi jud paaya kyunki cloud rules abhi publish nahi hui. Rules publish karke isi email + password se dobara jodein.' : authMsg(e)); }
    closeOv(); toast(`${name} jud gaye ✓ (${ROLES[role]})`); loadStaff();
  };
}
function staffEdit(id) {
  if (!can('staff')) return denyToast();
  const x = STAFF && STAFF[id]; if (!x || x.role === 'owner') return;
  sheet(esc(x.name || x.email), `<div class="kv"><span>Email</span><span>${esc(x.email)}</span></div>
  <div class="f" style="margin-top:10px"><label>Role badlein</label><select id="se_role">${roleOpts(x.role)}</select></div><div id="cl_err" class="rd" style="font-size:13px"></div>`,
    `<div class="btns"><button class="btn dan" id="se_del">Hatayein</button><button class="btn" id="se_save">Role Save</button></div>`);
  $('#se_save').onclick = async () => { try { await CL.db.ref(`erp/${CL.cfg.cid}/members/${id}/role`).set($('#se_role').value); closeOv(); toast('Role badal gaya ✓'); loadStaff(); } catch (e) { clErr(authMsg(e)); } };
  $('#se_del').onclick = async () => {
    closeOv(); if (!(await ask(`${esc(x.name || x.email)} ko company se hatana hai? Unka cloud access turant band ho jayega.`, { ok: 'Hatayein', danger: true }))) return;
    try { await CL.db.ref().update({ [`erp/${CL.cfg.cid}/members/${id}`]: null, [`erpUsers/${id}`]: null }); toast('Staff hata diya'); loadStaff(); } catch (e) { toast(authMsg(e)); }
  };
}

/* ---------- Settings card ---------- */
function cloudCardHTML() {
  const s = clState();
  const rules = `<div id="rulesMsg" class="card" style="display:${s.k === 'rules' ? 'block' : 'none'};background:var(--warnl);border:1px solid #fcd34d;margin:10px 0 0;padding:10px;font-size:13px">⚠️ <b>Cloud rules abhi publish nahi hui.</b> Aapka data is phone par safe hai aur app normal chalega. Owner Firebase console mein ERP rules publish kare — uske baad sync apne aap ho jayega.<div style="margin-top:8px"><button class="btn sm sec" onclick="clRetry()">Dobara Try Karein</button></div></div>`;
  if (!CL.cfg) return `<div class="card" id="cloudCard"><div class="kv"><span>☁️ Cloud Sync</span><span class="tag x" id="cloudStatus" data-k="off">OFF</span></div>
  <p class="mu" style="font-size:12.5px;margin:6px 0 10px">Optional hai. ON karne se data cloud par backup hoga, kai phones par chalega aur staff ko login de sakte hain. Bina cloud ke bhi app pehle jaisa offline chalta rahega.</p>
  <div class="btns"><button class="btn" id="clSignupBtn" onclick="cloudSheet('signup')">Company Banayein (Owner)</button><button class="btn ghost" id="clLoginBtn" onclick="cloudSheet('login')">Login (Owner / Staff)</button></div></div>`;
  const c = CL.cfg;
  return `<div class="card" id="cloudCard"><div class="kv"><span>☁️ Status</span><span class="tag ${s.c}" id="cloudStatus" data-k="${s.k}">${esc(s.t)}</span></div>
  <div class="kv"><span>Company</span><b>${esc(co().name || c.company || '—')}</b></div>
  <div class="kv"><span>Login</span><span>${esc(c.email)}</span></div>
  <div class="kv"><span>Aapka Role</span><b id="myRole">${esc(ROLES[c.role] || c.role)}</b></div>
  ${rules}
  <div class="btns" style="margin-top:10px"><button class="btn sec sm" onclick="clRetry()">🔄 Sync Now</button>${s.k === 'login' ? `<button class="btn sm" onclick="cloudSheet('login')">Login Karein</button>` : ''}<button class="btn ghost sm" id="clLogout" onclick="clLogout()">Logout</button></div></div>
  ${c.role === 'owner' ? `<div class="sect">Staff (Team)</div><div class="card"><div class="list" id="staffList" style="margin:0 0 10px"><div class="mu" style="font-size:13px">Load ho raha hai...</div></div><button class="btn full" id="staffAddBtn" onclick="staffAdd()">+ Staff Jodein</button>
  <p class="mu" style="font-size:12px;margin:8px 0 0">Roles: Manager = ${ROLE_INFO.manager}. Billing = ${ROLE_INFO.billing}. Viewer = ${ROLE_INFO.viewer}.</p></div>` : ''}`;
}
async function clBoot() {
  CL.cfg = (await DB.get('kv', 'cloud')) || null;
  CL.q = (await DB.get('kv', 'syncq')) || {};
  CL.tombs = (await DB.get('kv', 'tombs')) || {};
  if (CL.cfg) clStart();
}

/* ================= Boot ================= */
let HIDDEN_AT = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) HIDDEN_AT = Date.now(); else if (S.settings && S.settings.pin && HIDDEN_AT && Date.now() - HIDDEN_AT > 120000 && !$('#lock').classList.contains('on')) lockScreen('unlock'); });
(async function boot() {
  try { await DB.open(); await loadAll(); await clBoot(); }
  catch (e) { $('#main').innerHTML = emptyBox('⚠️', 'Storage nahi khul raha', 'Browser private mode mein ho to normal mode mein kholein.'); return; }
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/home');
  trackNav();
  if (S.settings.pin) lockScreen('unlock');
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => { });
})();

</script>
<button id="instBtn" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:9999;background:#16a34a;color:#fff;border:0;border-radius:24px;padding:14px 22px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)">&#11015; App Install karo</button>
<script>
(function(){var d,b=document.getElementById('instBtn');
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();d=e;b.style.display='block';});
b.onclick=function(){if(!d)return;d.prompt();d.userChoice.then(function(){b.style.display='none';d=null;});};
window.addEventListener('appinstalled',function(){b.style.display='none';});})();
