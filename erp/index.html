<body>
<header id="hdr"><h1>LedgerOne</h1></header>
<main id="main"><div class="empty">Loading...</div></main>
<nav id="tabs"></nav>
<div id="ov"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lock"></div>
<div id="print"></div>
<script>
'use strict';
/* ================= IndexedDB helper ================= */
const DB = {
  db: null, name: 'erp-db', // one IndexedDB per company: 'erp-db' = this phone's own business, 'erp-db-<cid>' = a CA client
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB.name, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['items', 'parties', 'vouchers'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = DB.db.transaction(store, mode); const st = tx.objectStore(store);
      const r = fn(st); let out;
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all(s) { return DB._req(s, 'readonly', st => st.getAll()); },
  get(s, k) { return DB._req(s, 'readonly', st => st.get(k)); },
  put(s, v, k) { return DB._req(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)); },
  del(s, k) { return DB._req(s, 'readwrite', st => st.delete(k)); },
  clear(s) { return DB._req(s, 'readwrite', st => st.clear()); },
  bulk(s, arr) { return DB._req(s, 'readwrite', st => { arr.forEach(v => st.put(v)); return null; }); }
};

/* ================= State ================= */
const APP = 'LedgerOne', APP_SUB = 'Billing • GST • Accounts', APP_VER = '3.0';
const S = { settings: null, items: [], parties: [], vouchers: [], audit: [], queries: [] };
const DEF_CO = () => ({ name: '', address: '', city: '', pin: '', gstin: '', state: '27', phone: '', email: '', prefix: 'INV-', ngPrefix: 'BL-', logo: '', bank: '', terms: 'Goods once sold will not be taken back.', openCash: 0, taxMode: 'regular', compRate: 1, fyNum: true, lut: false, lutNo: '', lutDate: '', turnover: 0, signatory: '' });
const DEF_SETTINGS = () => ({ setupDone: false, company: DEF_CO(), pin: '', counters: {} });
let CACHE = null;
function dirty() { CACHE = null; }
function upgradeSettings(s) {
  s = s || DEF_SETTINGS(); const c = s.company || {};
  if (s.setupDone && c.fyNum === undefined) c.fyNum = false; // existing businesses keep their current invoice series
  s.company = { ...DEF_CO(), ...c }; if (!s.counters) s.counters = {};
  return s;
}
async function loadAll() {
  S.settings = upgradeSettings(await DB.get('kv', 'settings'));
  S.items = await DB.all('items'); S.parties = await DB.all('parties');
  const allV = await DB.all('vouchers'); S.vouchers = allV.filter(v => v.type !== AUD_T && v.type !== QRY_T); S.audit = allV.filter(v => v.type === AUD_T); S.queries = allV.filter(v => v.type === QRY_T);
  AUD.snap = clone(S.settings); dirty();
  if (DB.name === 'erp-db') { try { if (S.settings.setupDone) localStorage.setItem('erpHome', co().name || 'My business'); else localStorage.removeItem('erpHome'); } catch (e) { } }
}
let SET_OK = false; // CA may only save settings through the period-lock actions
async function caBase() { const st = upgradeSettings(await DB.get('kv', 'settings')); st.pin = S.settings.pin || ''; return st; } // CA: last synced copy, never local edits
async function lockSave() { if (clOn() && ROLE() === 'ca') { const st = await caBase(); st.lockDate = S.settings.lockDate || ''; st.gstFiled = { ...(S.settings.gstFiled || {}) }; S.settings = st; } SET_OK = true; try { await saveSettings(); } finally { SET_OK = false; } }
async function saveSettings() { if (clOn() && ROLE() === 'ca' && !SET_OK) { S.settings = await caBase(); await DB.put('kv', S.settings, 'settings'); return; } S.settings.updatedAt = Date.now(); await DB.put('kv', S.settings, 'settings'); clPushSettings(); await audSettings(); }
async function saveRec(store, rec) {
  if (!canSave(store, rec)) { denyToast(); throw new Error('role'); }
  if (store === 'vouchers' && rec.type === AUD_T) throw new Error('audit');
  if (store === 'vouchers' && rec.type === QRY_T) throw new Error('query');
  const old = await DB.get(store, rec.id);
  if (store === 'vouchers') { const le = lockErr(rec, old); if (le) { toast(le); throw new Error('locked'); } }
  if (store === 'vouchers' && rec.entries) { const er = acvErr(rec); if (er) { toast(er); throw new Error(er); } }
  rec.updatedAt = Date.now(); if (!rec.createdAt) rec.createdAt = rec.updatedAt;
  await DB.put(store, rec);
  const arr = S[store]; const i = arr.findIndex(x => x.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  dirty(); clPushRec(store, rec);
  if (!old) await audLog('Create', store, rec, audSum(store, rec));
  else { const d = audDiff(old, rec); if (d) await audLog('Edit', store, rec, d); }
}
async function delRec(store, id) {
  if (clOn() && !can('delete')) { denyToast(); throw new Error('role'); }
  const old = S[store].find(x => x.id === id) || await DB.get(store, id);
  if (!old && store === 'vouchers' && (S.audit.some(a => a.id === id) || S.queries.some(a => a.id === id))) throw new Error('audit');

  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const conv = x => {
    if (x === 0) return '';
    const cr = Math.floor(x / 1e7), l = Math.floor(x / 1e5) % 100, th = Math.floor(x / 1000) % 100, r = x % 1000;
    return [cr ? conv(cr) + ' Crore' : '', l ? two(l) + ' Lakh' : '', th ? two(th) + ' Thousand' : '', r ? three(r) : ''].filter(Boolean).join(' ');
  };
  n = Math.abs(r2(n)); const rs = Math.floor(n), ps = Math.round((n - rs) * 100);
  if (!rs && ps) return two(ps) + ' Paise Only';
  let s = 'Rupees ' + (conv(rs) || 'Zero'); if (ps) s += ' and ' + two(ps) + ' Paise';
  return s + ' Only';
}

function ledgerRows(pid, to) {

/* Pure: voucher -> balanced Dr/Cr lines [{a, dr, cr}] */
function postings(v) {

      add('tcs_pay', -d * num(v.tcs));

    } else {

      add(P, -d * num(v.total));

      if (itc) { add('in_cgst', d * c); add('in_sgst', d * s); add('in_igst', d * i); add('in_cess', d * x); } else add(L, d * tax);

function restore(inp) {

    if (!(await ask(`Restoring will replace all current data with the backup (${d.items.length} items, ${d.parties.length} parties, ${d.vouchers.length} entries). Continue?`, { ok: 'Restore', danger: true }))) { inp.value = ''; return; }
    if (clOn() && !can('restore')) return denyToast();
    const old = {}; for (const s of SYNC_COLS) old[s] = S[s].map(x => x.id); old.au = new Set(S.audit.map(a => a.id));
    if (clOn()) { const t = Date.now(); for (const s of SYNC_COLS) d[s].forEach(r => r.updatedAt = t); d.settings.updatedAt = t; d.settings.pin = S.settings.pin || ''; }
    const keepA = new Map(S.audit.map(a => [a.id, a])); (Array.isArray(d.audit) ? d.audit : []).forEach(a => { if (a && a.type === AUD_T && a.id && !keepA.has(a.id)) keepA.set(a.id, a); });
    (Array.isArray(d.queries) ? d.queries : []).forEach(a => { if (a && a.type === QRY_T && a.id && !keepA.has(a.id)) keepA.set(a.id, a); }); S.queries.forEach(a => keepA.set(a.id, a));
    d.vouchers = d.vouchers.filter(v => v.type !== AUD_T && v.type !== QRY_T);
    for (const s of ['items', 'parties', 'vouchers']) { await DB.clear(s); await DB.bulk(s, d[s]); }
    await DB.bulk('vouchers', [...keepA.values()]);
    await DB.put('kv', upgradeSettings(d.settings), 'settings'); await loadAll();
    await audLog('Restore', 'settings', null, `Backup restored: ${d.items.length} items, ${d.parties.length} parties, ${d.vouchers.length} entries`, 'Data', 'Restore from backup');
    if (clOn()) for (const a of S.audit) if (!old.au || !old.au.has(a.id)) await clPushRec('vouchers', a);
    if (clOn()) { for (const s of SYNC_COLS) { const keep = new Set(d[s].map(x => x.id)); for (const id of old[s]) if (!keep.has(id)) await clPushDel(s, id); for (const r of d[s]) await clPushRec(s, r); } await clPushSettings(); }
    toast('Restore complete ✓'); replaceTo('home');
  };

}

async function hashPin(p) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('erp:' + p)); return 'h:' + Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return 'p:' + p; } }
let LOCK = { mode: '', buf: '', first: '' };
function lockScreen(mode) {
  LOCK = { mode, buf: '', first: '' }; const el = $('#lock'); el.classList.add('on'); drawLock();
}
function drawLock(msg) {
  const m = LOCK.mode; const title = m === 'unlock' ? 'Enter PIN' : m === 'set1' ? 'New 4-digit PIN' : 'Confirm PIN';
  $('#lock').innerHTML = `<div style="font-size:15px;opacity:.85">${esc(co().name || APP)}</div><div style="font-size:21px;font-weight:700">${title}</div><div style="min-height:20px;font-size:13px;color:#fecaca">${msg || ''}</div>
  <div class="dots" id="ldots">${[0, 1, 2, 3].map(i => `<i class="${i < LOCK.buf.length ? 'f' : ''}"></i>`).join('')}</div>
  <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="pinKey('${n}')">${n}</button>`).join('')}${m === 'unlock' ? '<span></span>' : `<button onclick="pinCancel()" style="font-size:14px">Cancel</button>`}<button onclick="pinKey('0')">0</button><button onclick="pinKey('del')" aria-label="Delete">⌫</button></div>`;
}
async function pinKey(k) {
  if (k === 'del') { LOCK.buf = LOCK.buf.slice(0, -1); return drawLock(); }
  if (LOCK.buf.length >= 4) return; LOCK.buf += k; drawLock(); if (LOCK.buf.length < 4) return;
  const m = LOCK.mode, p = LOCK.buf;
  if (m === 'unlock') { if ((await hashPin(p)) === S.settings.pin) { $('#lock').classList.remove('on'); $('#lock').innerHTML = ''; } else { LOCK.buf = ''; drawLock('Wrong PIN'); $('#ldots').classList.add('shake'); } return; }
  if (m === 'set1') { LOCK.first = p; LOCK.buf = ''; LOCK.mode = 'set2'; return setTimeout(() => drawLock(), 120); }
  if (m === 'set2') { if (p !== LOCK.first) { LOCK = { mode: 'set1', buf: '', first: '' }; return drawLock('PINs did not match, please try again'); } S.settings.pin = await hashPin(p); await saveSettings(); pinCancel(); toast('PIN set 🔒'); render(); }
}
function pinCancel() { $('#lock').classList.remove('on'); $('#lock').innerHTML = ''; }
async function removePin() { if (!(await ask('Remove the PIN lock?', { ok: 'Remove' }))) return; S.settings.pin = ''; await saveSettings(); toast('PIN removed'); render(); }

// Notified extensions: 'ruleId:periodStart' -> new due date
const COMP_EXT = {
  'audit:2025-04-01': ['2026-10-21', 'CBDT Circular 07/2026'],
  'itr:2025-04-01': ['2026-11-21', 'CBDT Circular 07/2026']
};
const QRMP22 = ['22', '23', '24', '25', '26', '27', '29', '30', '31', '32', '33', '34', '35', '36', '37', '28'];
const CMP_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const cmpPad = n => String(n).padStart(2, '0');
const cmpDays = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const cmpFyEnd = d => { const s = fyStart(d); return `${+s.slice(0, 4) + 1}-03-31`; };
function cmpOpts() {
  const c = S.settings.comp || {};
  return { mode: taxMode(), qrmp: !!c.qrmp, state: co().state || '27', tds: c.tds !== undefined ? !!c.tds : S.vouchers.some(v => num(v.tds) > 0), audit: !!c.audit };
}
function cmpWhen(w, o) {
  const reg = o.mode === 'regular';
  return { gstM: reg && !o.qrmp, gstQ: reg && o.qrmp, gstReg: reg, comp: o.mode === 'composition', tds: o.tds, it: true, audit: o.audit, noaudit: !o.audit }[w];
}
// all due items whose due date is within [from, to]
function cmpCalendar(from, to, o = cmpOpts()) {
  const out = [], done = S.settings.compDone || {};
  const add = (r, ps, plabel, due, extra) => {
    const key = `${r.id}:${ps}`, ex = COMP_EXT[key]; if (ex) due = ex[0];
    if (due < from || due > to) return;
    out.push({ key, id: r.id, name: r.name + (extra ? ` (${extra})` : ''), period: plabel, due, sec: r.sec, src: r.src, ext: ex ? ex[1] : '', done: !!done[key] });
  };
  const y0 = +fyStart(addDays(from, -500)).slice(0, 4), y1 = +fyStart(to).slice(0, 4);
  for (let y = y0; y <= y1; y++) {
    for (const r of COMPLIANCE_RULES.due) {
      if (!cmpWhen(r.when, o)) continue;
      if (r.k === 'm') for (let i = 0; i < 12; i++) {
        const m = (3 + i) % 12 + 1, yr = m < 4 ? y + 1 : y; if (r.qm && !r.qm.includes(i % 3)) continue;
        const nm = m === 12 ? 1 : m + 1, ny = m === 12 ? yr + 1 : yr;
        const due = r.march && m === 3 ? `${ny}-${r.march}` : `${ny}-${cmpPad(nm)}-${cmpPad(r.day)}`;
        add(r, `${yr}-${cmpPad(m)}-01`, `${CMP_MON[m - 1]} ${yr}`, due);
      }
      else if (r.k === 'q') for (let q = 0; q < 4; q++) {
        const sm = [4, 7, 10, 1][q], sy = q === 3 ? y + 1 : y, em = sm + 2, dm = em === 12 ? 1 : em + 1, dy = em === 12 ? sy + 1 : sy;
        let due;
        if (r.qd) due = `${q >= 2 ? y + 1 : y}-${r.qd[q]}`;
        else { const d = r.day === 'qrmp' ? (QRMP22.includes(o.state) ? 22 : 24) : r.day; due = `${dy}-${cmpPad(dm)}-${cmpPad(d)}`; }
        add(r, `${sy}-${cmpPad(sm)}-01`, `${CMP_MON[sm - 1]}–${CMP_MON[em - 1]} ${sy}`, due);
      }
      else for (const [md, off, lbl] of r.dates) add(r, `${y}-04-01`, `FY ${y}-${String(y + 1).slice(2)}`, `${y + off}-${md}`, lbl);
    }
  }
  return out.sort((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name));
}
async function cmpToggleDone(key, on) {
  const d = S.settings.compDone = { ...(S.settings.compDone || {}) };
  if (on) d[key] = today(); else delete d[key];
  await saveSettings();
}
// overdue (last 60 days, not done) + due in next 7 days
function cmpAlerts(d = today()) {
  // overdue looks back 60 days, but not before the first entry in the books (avoids alerts for periods before the app was used)
  const first = S.vouchers.reduce((m, v) => v.date && v.date < m ? v.date : m, d);
  const from = first > addDays(d, -60) ? first : addDays(d, -60);
  const cal = cmpCalendar(from, addDays(d, 7)).filter(x => !x.done);
  return { overdue: cal.filter(x => x.due < d), soon: cal.filter(x => x.due >= d) };
}

/* unpaid purchase bills of a supplier as on a date: balance owed is matched to the newest bills (older bills are treated as paid first) */
function cmpUnpaidPurch(pid, asOf) {
  let b = 0; try { const lr = ledgerRows(pid, asOf); b = lr[lr.length - 1].bal; } catch (e) { return []; }
  let rem = r2(-b); const out = []; if (rem <= 0.004) return out;
  const bills = S.vouchers.filter(v => v.partyId === pid && v.type === 'purchase' && v.date <= asOf).sort((a, c) => c.date.localeCompare(a.date) || (c.createdAt || 0) - (a.createdAt || 0));
  for (const v of bills) {
    if (rem <= 0.004) break;
    const due = r2(num(v.total) - num(v.paid) - num(v.tds)); if (due <= 0.004) continue;
    const u = r2(Math.min(due, rem)); out.push({ v, unpaid: u }); rem = r2(rem - u);
  }
  return out;
}
const vItcAmt = v => r2(num(v.cgst) + num(v.sgst) + num(v.igst) + num(v.cess));
const vItcOn = v => v.type === 'purchase' && v.itc !== false && vMode(v) === 'regular' && !v.rcm && vItcAmt(v) > 0;
const msmeLimit = p => p.msmeAgree ? Math.min(COMPLIANCE_RULES.msme.maxAgree, num(p.msmeDays) || COMPLIANCE_RULES.msme.maxAgree) : COMPLIANCE_RULES.msme.noAgree;
function cmpMsme(asOf = today()) {
  const fs = fyStart(asOf), fe = cmpFyEnd(asOf), rows = [];
  for (const p of S.parties) {
    if (!p.msme || p.msmeCat === 'medium') continue;
    const lim = msmeLimit(p);
    for (const { v, unpaid } of cmpUnpaidPurch(p.id, asOf)) {
      const days = cmpDays(v.date, asOf), deadline = addDays(v.date, lim);
      const expShare = vItcOn(v) && num(v.total) ? r2(unpaid * (num(v.total) - vItcAmt(v)) / num(v.total)) : unpaid;
      const atRisk = v.date >= fs && deadline <= fe ? expShare : 0;
      rows.push({ pid: p.id, name: p.name, udyam: p.udyam || '', id: v.id, no: v.billNo || v.no, date: v.date, unpaid, days, limit: lim, deadline, overdue: days > lim, left: lim - days, atRisk, prevFy: v.date < fs });
    }
  }
  rows.sort((a, b) => a.left - b.left);
  return { rows, fe, atRisk: r2(rows.reduce((s, r) => s + r.atRisk, 0)), overdue: rows.filter(r => r.overdue).length, unpaid: r2(rows.reduce((s, r) => s + r.unpaid, 0)) };
}

/* cash transactions relevant to the cash limits */
const isCashAcc = a => a === 'cash' || ledGroup(a) === 'cashg';
function cmpCashTx(vs = S.vouchers) {
  const tx = [];
  const pk = pid => { const p = party(pid); return { key: 'p:' + pid, name: p ? p.name : 'Party', tr: !!(p && p.transporter) }; };
  for (const v of vs) {
    const cash = (v.mode || 'Cash') === 'Cash';
    if ((v.type === 'sale' || v.type === 'dn') && cash && num(v.paid) > 0) tx.push({ vid: v.id, no: v.no, date: v.date, kind: 'rcpt', amt: num(v.paid), ...(v.partyId ? pk(v.partyId) : { key: 'v:' + v.id, name: 'Walk-in customer' }) });
    else if (v.type === 'payin' && cash) tx.push({ vid: v.id, no: v.no, date: v.date, kind: 'rcpt', amt: num(v.amount), ...(v.partyId ? pk(v.partyId) : { key: 'v:' + v.id, name: 'Unknown' }) });
    else if (v.type === 'purchase' && cash && num(v.paid) > 0) tx.push({ vid: v.id, no: v.no, date: v.date, kind: 'exp', amt: num(v.paid), ...(v.partyId ? pk(v.partyId) : { key: 'v:' + v.id, name: 'Unknown supplier' }) });
    else if (v.type === 'payout' && cash) tx.push({ vid: v.id, no: v.no, date: v.date, kind: 'exp', amt: num(v.amount), ...(v.partyId ? pk(v.partyId) : { key: 'v:' + v.id, name: 'Unknown' }) });
    else if (v.type === 'exp' && cash && !v.pers) {
      const p = v.tdsParty ? party(v.tdsParty) : null, vn = (v.vendor || '').trim();
      const who = p ? { key: 'p:' + p.id, name: p.name } : vn ? { key: 'n:' + vn.toLowerCase(), name: vn } : { key: 'v:' + v.id, name: v.category || 'Expense' };
      tx.push({ vid: v.id, no: v.no, date: v.date, kind: 'exp', amt: r2(num(v.amount) - num(v.tds)), ...who, tr: !!(p && p.transporter) || /freight|transport|cartage|lorry|truck/i.test(v.category || '') });
    }
    else if (v.entries) {
      const net = r2(v.entries.filter(e => isCashAcc(e.a)).reduce((s, e) => s + num(e.dr) - num(e.cr), 0)); if (!net) continue;
      const side = net < 0 ? 'dr' : 'cr';
      for (const e of v.entries) {
        const x = num(e[side]); if (!x || isCashAcc(e.a)) continue;
        const g = ledGroup(e.a), isP = String(e.a).startsWith('p:');
        if (g === 'bankg' || g === 'capital') continue;
        const who = isP ? pk(e.a.slice(2)) : { key: 'v:' + v.id + ':' + e.a, name: ((S.settings.ledgers || []).find(l => l.id === e.a) || {}).name || e.a };
        const kind = g === 'loans' ? (net < 0 ? 'loanOut' : 'loanIn') : net < 0 ? (isP || ['indexp', 'direxp', 'purg'].includes(g) ? 'exp' : '') : 'rcpt';
        if (kind) tx.push({ vid: v.id, no: v.no, date: v.date, kind, amt: r2(x), ...who });
      }
    }
  }
  return tx;
}
function cmpCashIssues(from, to, vs) {
  const R = COMPLIANCE_RULES, tx = cmpCashTx(vs).filter(t => (!from || t.date >= from) && (!to || t.date <= to)), out = [];
  const grp = kind => { const m = new Map(); tx.filter(t => t.kind === kind).forEach(t => { const k = t.date + '|' + t.key; const g = m.get(k) || { date: t.date, name: t.name, total: 0, tr: true, vids: [], nos: [], max: 0 }; g.total = r2(g.total + t.amt); g.tr = g.tr && !!t.tr; g.vids.push(t.vid); g.nos.push(t.no); g.max = Math.max(g.max, t.amt); m.set(k, g); }); return [...m.values()]; };
  for (const g of grp('exp')) { const lim = g.tr ? R.cashExp.transporter : R.cashExp.limit; if (g.total > lim) out.push({ ...g, rule: 'exp', limit: lim, sec: R.cashExp.sec, msg: `Cash paid to ${g.name} on ${fd(g.date)} is ${inr(g.total)} — above ${inr(lim)} in a day. This expense may not be allowed for income tax (${R.cashExp.sec}). Pay by bank / UPI.` }); }
  for (const g of grp('rcpt')) if (g.total >= R.cashRcpt.limit || g.max >= R.cashRcpt.limit) out.push({ ...g, rule: 'rcpt', limit: R.cashRcpt.limit, sec: R.cashRcpt.sec, msg: `Cash received from ${g.name} on ${fd(g.date)} is ${inr(g.total)} — ₹2,00,000 or more. Penalty can equal the amount (${R.cashRcpt.sec}). Take it by bank / UPI.` });
  for (const t of tx) if ((t.kind === 'loanIn' || t.kind === 'loanOut') && t.amt >= R.cashLoan.limit) { const sec = t.kind === 'loanIn' ? R.cashLoan.secIn : R.cashLoan.secOut; out.push({ date: t.date, name: t.name, total: t.amt, vids: [t.vid], nos: [t.no], rule: t.kind, limit: R.cashLoan.limit, sec, msg: `Loan ${t.kind === 'loanIn' ? 'taken' : 'repaid'} in cash (${t.name}, ${inr(t.amt)} on ${fd(t.date)}) — ₹20,000 or more must go through bank (${sec}).` }); }
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
// warnings for one voucher being saved (others on the same day count too)
function cashWarnFor(v) {
  const vs = S.vouchers.filter(x => x.id !== v.id).concat([v]);
  return cmpCashIssues(v.date, v.date, vs).filter(i => i.vids.includes(v.id)).map(i => i.msg);
}
function cmpCashNotice(v) {
  let m = []; try { m = cashWarnFor(v); } catch (e) { console.warn(e); }
  const old = $('#cmpWarn'); if (old) old.remove(); if (!m.length) return m;

  d.style.cssText = 'position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:210;background:#fff7ed;border:1px solid #f59e0b;border-radius:12px;padding:10px 34px 10px 12px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.15)';
  d.innerHTML = `<b>⚠️ Cash limit</b> — saved, but please check:<ul style="margin:6px 0 4px 16px;padding:0">${m.map(x => `<li>${esc(x)}</li>`).join('')}</ul><span class="mu" style="font-size:11.5px">Estimate — confirm with your CA.</span><button aria-label="Close" onclick="this.parentNode.remove()" style="position:absolute;right:6px;top:6px;border:0;background:none;font-size:18px;cursor:pointer">✕</button>`;
  document.body.appendChild(d); setTimeout(() => { if (d.parentNode) d.remove(); }, 12000);

/* ITC on bills not paid within 180 days */
function cmpItc180(asOf = today()) {
  const R = COMPLIANCE_RULES.itc180, rows = [];
  const sup = new Set(S.vouchers.filter(v => v.type === 'purchase' && v.partyId).map(v => v.partyId));
  for (const pid of sup) for (const { v, unpaid } of cmpUnpaidPurch(pid, asOf)) {
    if (!vItcOn(v)) continue; const days = cmpDays(v.date, asOf); if (days <= R.days) continue;
    const itc = vItcAmt(v), rev = r2(itc * unpaid / num(v.total));
    rows.push({ pid, name: (party(pid) || {}).name || '', id: v.id, no: v.billNo || v.no, date: v.date, days, unpaid, itc, rev, day180: addDays(v.date, R.days), interest: r2(rev * R.rate / 100 * days / 365) });
  }
  rows.sort((a, b) => b.days - a.days);
  return { rows, rev: r2(rows.reduce((s, r) => s + r.rev, 0)), interest: r2(rows.reduce((s, r) => s + r.interest, 0)) };
}

/* Home badge */
function cmpHomeCard() {
  if (!can('reports')) return '';
  let A, M; try { A = cmpAlerts(); M = cmpMsme(); } catch (e) { return ''; }
  const n = A.overdue.length + A.soon.length, mo = M.overdue;
  if (!n && !mo) return '';
  const bits = [];
  if (A.overdue.length) bits.push(`<span class="rd">${A.overdue.length} overdue</span>`);
  if (A.soon.length) bits.push(`${A.soon.length} due in 7 days`);
  if (mo) bits.push(`<span class="rd">${mo} MSME bill${mo === 1 ? '' : 's'} past due</span>`);
  const nx = A.overdue[0] || A.soon[0];
  return `<div class="card" id="cmpBadge" onclick="go('compliance')" style="cursor:pointer;border-left:4px solid ${A.overdue.length || mo ? '#dc2626' : '#f59e0b'};display:flex;align-items:center;gap:8px">🗓 <div style="flex:1"><b>Compliance</b> · <span id="cmpBadgeN">${bits.join(' · ')}</span>${nx ? `<div class="mu" style="font-size:12.5px">${esc(nx.name)} — ${fd(nx.due)}</div>` : ''}</div></div>`;
}

/* Screen */
let CMP_TAB = 'cal', CMP_MONTH = '';
function vCompliance(q = {}) {
  if (q.t) CMP_TAB = q.t;
  hdr('Compliance', { back: true });
  const tabs = [['cal', 'Due dates'], ['msme', 'MSME 45-day'], ['cash', 'Cash limits'], ['itc', 'ITC 180-day'], ['audit', 'Tax audit'], ['firm', 'Partners'], ['q194', 'TDS on purchase'], ['dp', 'Stock statement']];
  const R = COMPLIANCE_RULES, t = today();
  let body = '';
  if (CMP_TAB === 'cal') {

/* ---- money in / out split cash vs bank (contra and money-only entries left out) ---- */
function ca2MoneyFlow(from, to) {
  const o = { cashR: 0, bankR: 0, cashP: 0, bankP: 0 };
  for (const v of S.vouchers) {
    if (v.date < from || v.date > to || v.type === 'contra') continue;
    const P = postings(v); if (!P.length || P.every(e => isMoney(e.a))) continue;
    for (const e of P) { if (!isMoney(e.a)) continue; const c = isCashAcc(e.a); if (e.dr) o[c ? 'cashR' : 'bankR'] += e.dr; if (e.cr) o[c ? 'cashP' : 'bankP'] += e.cr; }
  }
  for (const k in o) o[k] = r2(o[k]);
  o.totR = r2(o.cashR + o.bankR); o.totP = r2(o.cashP + o.bankP);
  o.rPct = ca2Pct(o.cashR, o.totR); o.pPct = ca2Pct(o.cashP, o.totP);
  return o;
}
/* ---- 1. tax audit applicability ---- */
function ca2Audit(y = ca2Fy(), prof = !!ca2Comp().prof) {

  else if (turnover <= R.bizLimit) { applies = false; reason = `Turnover ${inr(turnover)} is within ${inr(R.bizLimit)}.`; }
  else if (turnover > R.bizLimitLowCash) { applies = true; reason = `Turnover ${inr(turnover)} is above ${inr(R.bizLimitLowCash)}.`; }
  else {
    const low = F.rPct <= R.cashPct && F.pPct <= R.cashPct;
    applies = !low;
    reason = low ? `Turnover ${inr(turnover)} is between ₹1 crore and ₹10 crore, and cash receipts (${F.rPct}%) and cash payments (${F.pPct}%) are both ${R.cashPct}% or less — limit is ₹10 crore.` : `Turnover ${inr(turnover)} is above ₹1 crore and cash ${F.rPct > R.cashPct ? `receipts are ${F.rPct}%` : `payments are ${F.pPct}%`} (more than ${R.cashPct}%), so the ₹10 crore limit does not apply.`;
  }
  const PR = RATES.pres;
  const presNote = prof
    ? `Presumptive scheme (Sec ${PR.sec}): professionals with receipts up to ${inr(PR.profLimit)} (${inr(PR.profLimitDigital)} if cash is ${PR.cashMaxPct}% or less) can declare ${PR.profRate}% as income without audit. Declaring less while income is above the basic exemption needs an audit.`
    : `Presumptive scheme (Sec ${PR.sec}): turnover up to ${inr(PR.bizLimit)} (${inr(PR.bizLimitDigital)} if cash receipts are ${PR.cashMaxPct}% or less) can declare ${PR.digitalRate}% (bank / UPI) / ${PR.cashRate}% (cash) as profit without audit. Declaring lower profit while income is above the basic exemption needs an audit even below ₹1 crore; leaving the scheme bars it for 5 years.`;
  return { y, fs, fe, prof, turnover, gp: P.gp, np: P.np, ...F, applies, reason, presNote };
}
/* quantitative stock summary for the year */
function ca2StockQty(fs, fe) {
  const rows = [];
  for (const it of S.items) {
    if (it.type === 'service') continue;
    const r = { id: it.id, name: it.name, unit: it.unit || '', open: r2(stockAsOf(it.id, addDays(fs, -1))), pur: 0, sale: 0, prodIn: 0, used: 0, other: 0 };
    for (const v of S.vouchers) {
      if (v.date < fs || v.date > fe) continue; const t = VT[v.type]; if (!t) continue;
      if (t.lines && t.stock) for (const l of v.lines || []) { if (l.itemId !== it.id) continue; const q = t.stock * num(l.qty); if (v.type === 'purchase' || v.type === 'pret') r.pur += q; else if (v.type === 'sale' || v.type === 'sret') r.sale -= q; else r.other += q; }
      if (v.type === 'prod') { if (v.outItem === it.id) r.prodIn += num(v.outQty); for (const l of v.lines || []) if (l.itemId === it.id) r.used += num(l.qty); }
    }
    ['pur', 'sale', 'prodIn', 'used', 'other'].forEach(k => { r[k] = r2(r[k]); });
    r.close = r2(stockAsOf(it.id, fe));
    if (r.open || r.pur || r.sale || r.prodIn || r.used || r.other || r.close) rows.push(r);
  }
  return rows.sort((a, b) => a.name.localeCompare(b.name));
}

function ca2Firm(y = ca2Fy()) {
  const c = ca2FirmCfg(), R = CA2_RULES.partner, [fs, fe] = ca2Range(y);
  const on = c.type === 'firm' || c.type === 'llp';
  const M = periodMove(fs, fe), T0 = accTotals(addDays(fs, -1)), L = accList();
  const sumL = ids => r2(ids.reduce((s, id) => s + (M.get(id) || 0), 0));
  const rate = Math.min(num(c.intRate) || 0, R.intMax);
  const partners = (c.partners || []).map(p => { const cap = p.capAcc ? r2(-(T0.get(p.capAcc) || 0)) : 0; return { ...p, capName: p.capAcc ? accById(p.capAcc, L).name : '—', capital: cap, intAllowed: r2(Math.max(0, cap) * rate / 100), intMax: r2(Math.max(0, cap) * R.intMax / 100) }; });

  const bookProfit = r2(np + actRem + intExcess);

  const maxRem = working ? ca2MaxRem(bookProfit) : 0;
  const remExcess = r2(Math.max(0, actRem - maxRem));
  return { on, type: c.type, y, fs, fe, rate, partners, intAllowedT: r2(partners.reduce((s, p) => s + p.intAllowed, 0)), intMaxT, actInt, intExcess, actRem, np, bookProfit, working, maxRem, remExcess, disallowed: r2(remExcess + intExcess) };
}

/* ---- 3. TDS on purchase of goods (old 194Q) ---- */
function ca2Q194(y = ca2Fy()) {
  const R = CA2_RULES.q194, [fs, fe] = ca2Range(y), on = !!ca2Comp().q194;
  const m = new Map();
  const vs = S.vouchers.filter(v => v.date >= fs && v.date <= fe && v.partyId && (v.type === 'purchase' || v.type === 'pret')).sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  for (const v of vs) {
    const p = party(v.partyId); const r = m.get(v.partyId) || { pid: v.partyId, name: p ? p.name : '', pan: p ? p.pan || '' : '', total: 0, crossed: '', deducted: 0 };
    r.total = r2(r.total + (v.type === 'pret' ? -1 : 1) * num(v.taxable));
    if (!r.crossed && r.total > R.limit) r.crossed = v.date;
    if (v.type === 'purchase' && num(v.tds) > 0 && /194Q|8\(ii\)/i.test(tdsSecOf(v))) r.deducted = r2(r.deducted + num(v.tds));
    m.set(v.partyId, r);
  }
  const rows = [...m.values()].map(r => { const excess = r2(Math.max(0, r.total - R.limit)), rate = r.pan ? R.rate : R.noPanRate, tds = r2(excess * rate / 100); return { ...r, flag: excess > 0, excess, rate, tds, short: r2(Math.max(0, tds - r.deducted)), near: !excess && r.total >= R.limit * 0.8 }; }).sort((a, b) => b.total - a.total);
  let lastTurn = 0; try { const P = plCalc(`${y - 1}-04-01`, `${y}-03-31`); lastTurn = r2(P.netSales + P.dirIncT); } catch (e) { }
  const fl = rows.filter(r => r.flag);
  return { on, y, rows, flagged: fl, lastTurn, tds: r2(fl.reduce((s, r) => s + r.tds, 0)), short: r2(fl.reduce((s, r) => s + r.short, 0)) };
}

/* ---- 4. CC / OD stock statement + drawing power ---- */
const ca2DpCfg = () => ({ sm: CA2_RULES.dp.stockMargin, dm: CA2_RULES.dp.debtMargin, limit: 0, odAcc: '', bank: '', ...(S.settings.dp || {}) });
const ca2OdAccs = () => accList().filter(l => !l.party && (l.group === 'bankg' || l.group === 'loans'));
function ca2Debtors(asOf) {
  const D = CA2_RULES.dp.debtDays, rows = [];
  for (const p of S.parties) {
    let b = 0; try { const lr = ledgerRows(p.id, asOf); b = lr[lr.length - 1].bal; } catch (e) { continue; }
    if (b <= 0.004) continue;
    let rem = r2(b), young = 0;
    const bills = S.vouchers.filter(v => v.partyId === p.id && (v.type === 'sale' || v.type === 'dn') && v.date <= asOf).sort((a, c) => c.date.localeCompare(a.date) || (c.createdAt || 0) - (a.createdAt || 0));
    for (const v of bills) { if (rem <= 0.004) break; const due = v.type === 'dn' ? num(v.total) : r2(num(v.total) - num(v.paid) - num(v.tds)); if (due <= 0.004) continue; const u = Math.min(due, rem); if (cmpDays(v.date, asOf) <= D) young += u; rem = r2(rem - u); }
    young = r2(young); rows.push({ name: p.name, total: r2(b), young, old: r2(b - young) });
  }
  return rows.sort((a, c) => c.total - a.total);
}
function ca2Creditors(asOf) {
  const rows = [];
  for (const p of S.parties) { let b = 0; try { const lr = ledgerRows(p.id, asOf); b = lr[lr.length - 1].bal; } catch (e) { continue; } if (b < -0.004) rows.push({ name: p.name, amt: r2(-b) }); }
  return rows.sort((a, c) => c.amt - a.amt);
}
function ca2DP(asOf = today(), cfg = ca2DpCfg()) {
  const stock = S.items.filter(i => i.type !== 'service').map(i => { const q = r2(stockAsOf(i.id, asOf)); return { name: i.name, unit: i.unit || '', qty: q, rate: num(i.purchaseRate), value: r2(Math.max(0, q) * num(i.purchaseRate)) }; }).filter(r => r.qty > 0);
  const stockT = r2(stock.reduce((s, r) => s + r.value, 0));
  const deb = ca2Debtors(asOf), cred = ca2Creditors(asOf);
  const debYoung = r2(deb.reduce((s, r) => s + r.young, 0)), debOld = r2(deb.reduce((s, r) => s + r.old, 0)), credT = r2(cred.reduce((s, r) => s + r.amt, 0));
  const sm = num(cfg.sm), dm = num(cfg.dm);
  const netStock = r2(Math.max(0, stockT - credT));
  const dpStock = r2(netStock * (1 - sm / 100)), dpDebt = r2(debYoung * (1 - dm / 100)), dp = r2(dpStock + dpDebt);
  const limit = num(cfg.limit);
  let used = 0; if (cfg.odAcc) { const b = accTotals(asOf).get(cfg.odAcc) || 0; used = r2(Math.max(0, -b)); }
  const avail = limit ? r2(Math.min(dp, limit)) : dp;
  return { asOf, stock, stockT, deb, cred, debYoung, debOld, credT, sm, dm, netStock, dpStock, dpDebt, dp, limit, used, avail, headroom: r2(avail - used), odName: cfg.odAcc ? accById(cfg.odAcc).name : '', bank: cfg.bank || '' };
}

function canV(type) { const r = ROLE(); if (r === 'owner' || r === 'manager') return true; if (r === 'billing') return type === 'sale' || type === 'quote'; return false; }

/* ---------- remote merge (last write wins) ---------- */
function localU(col, id) {
  if (col === 'settings') return S.settings.updatedAt || 0;
  const r = S[col].find(x => x.id === id) || (col === 'vouchers' ? (S.audit.find(x => x.id === id) || S.queries.find(x => x.id === id)) : null); const t = CL.tombs[col + '/' + id] || 0;
  return Math.max(r ? (r.updatedAt || 0) : 0, t);
}
function applyRemote(col, id, val) {
  CL.chain = CL.chain.then(async () => {
    if (!val || typeof val.updatedAt !== 'number') return;
    if (col !== 'settings' && !SYNC_COLS.includes(col)) return;
    if (val.updatedAt <= localU(col, id)) return;
    const qk = col + '/' + id; if (CL.q[qk] && CL.q[qk].updatedAt >= val.updatedAt) return;
    if (col === 'settings') {
      if (val.deleted) return;
      let s; try { s = JSON.parse(val.j); } catch (e) { return; }
      S.settings = upgradeSettings({ ...DEF_SETTINGS(), ...s, pin: S.settings.pin || '', updatedAt: val.updatedAt });
      await DB.put('kv', S.settings, 'settings'); AUD.snap = clone(S.settings);
    } else if (col === 'vouchers' && (String(id).startsWith('au_') || S.audit.some(x => x.id === id))) {
      if (val.deleted) return; // audit entries are never deleted
      let rec; try { rec = JSON.parse(val.j); } catch (e) { return; } if (rec.type !== AUD_T) return;
      rec.updatedAt = val.updatedAt; rec.id = id; await DB.put(col, rec);
      const i = S.audit.findIndex(x => x.id === id); if (i >= 0) S.audit[i] = rec; else S.audit.push(rec); return;
    } else if (col === 'vouchers' && (String(id).startsWith('q_') || S.queries.some(x => x.id === id))) {
      if (val.deleted) return; // queries are never deleted
      let rec; try { rec = JSON.parse(val.j); } catch (e) { return; } if (rec.type !== QRY_T) return;
      rec.updatedAt = val.updatedAt; rec.id = id; await DB.put(col, rec);
      const i = S.queries.findIndex(x => x.id === id); if (i >= 0) S.queries[i] = rec; else S.queries.push(rec);
    } else if (val.deleted) {
      await DB.del(col, id); S[col] = S[col].filter(x => x.id !== id); CL.tombs[qk] = val.updatedAt; await clSaveTombs();
    } else {
      let rec; try { rec = JSON.parse(val.j); } catch (e) { return; }
      rec.updatedAt = val.updatedAt; rec.id = id; await DB.put(col, rec);
      const arr = S[col]; const i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = rec; else arr.push(rec);
      if (CL.tombs[qk]) { delete CL.tombs[qk]; await clSaveTombs(); }
    }
    dirty(); clRerender();
  }).catch(e => console.warn('merge', e));
  return CL.chain;
}
function clRerender() {
  clearTimeout(CL.renderT);
  CL.renderT = setTimeout(() => {
    const { parts } = parseHash(); const [a, b] = parts;
    if ($('#ov').classList.contains('on')) return;
    if (!S.settings.setupDone || (a === 'setup')) return render();
    const safe = ['home', 'bill', 'stock', 'party', 'more', 'v', 'p', 'reports', 'r'].includes(a) || (a === 'queries' && !$$('.q_rep').some(t => t.value)) || ((a === 'exp' || a === 'prod') && b !== 'new');

/* ---------- start / attach ---------- */
function clDetach() { CL.subs.forEach(f => { try { f(); } catch (e) { } }); CL.subs = []; CL.attached = null; if (CL.authUnsub) { try { CL.authUnsub(); } catch (e) { } CL.authUnsub = null; } }
function sub(ref, ev, cb, err) { const h = ref.on(ev, cb, err); CL.subs.push(() => ref.off(ev, h)); }
async function clStart() {
  if (!CL.cfg) return;

  fbInit();
  if (CL.started) { clFlush(); clStatus(); return; }
  CL.started = true;
  sub(CL.db.ref('.info/connected'), 'value', s => { CL.connected = !!s.val(); clStatus(); if (CL.connected) { if (CL.cfg && CL.cfg.pendingCreate && CL.user) clAttach(); else clFlush(); } });

let ATTACHING = false;
async function clAttach() {
  if (ATTACHING || !CL.cfg) return;
  if (CL.attached === CL.cfg.cid && !CL.cfg.pendingCreate) { clFlush(); return; }
  ATTACHING = true;
  try {
    const c = CL.cfg;
    if (c.pendingCreate) { const ok = await createCompany(); if (!ok) return; }
    CL.subs.splice(1).forEach(f => { try { f(); } catch (e) { } }); // keep .info/connected (first sub)
    const base = CL.db.ref(`erp/${c.cid}`);
    const onErr = e => { if (isDenied(e)) { CL.denied = true; clStatus(); } };
    sub(base.child(`members/${c.uid}`), 'value', async s => {
      const m = s.val(); CL.denied = false;
      if (!m) { await clRemoved(); return; }
      if (m.role === 'ca') caSynced(c.cid);
      if (m.role !== c.role || m.name !== c.name) { c.role = m.role; c.name = m.name || c.name; await clSaveCfg(); render(); }
      clStatus();
    }, e => { if (isDenied(e) && c.role === 'ca') { clRemoved(); return; } onErr(e); });
    if (!c.inited) { const ok = await initialSync(); if (!ok) return; }
    for (const col of [...SYNC_COLS, 'settings']) {
      const r = base.child(`data/${col}`);
      sub(r, 'child_added', s => applyRemote(col, s.key, s.val()), onErr);
      sub(r, 'child_changed', s => applyRemote(col, s.key, s.val()), onErr);
    }
    CL.attached = c.cid; if (c.role === 'ca') caSynced(c.cid); clFlush();
  } finally { ATTACHING = false; clStatus(); }
}
async function createCompany() {

async function initialSync() {
  const c = CL.cfg; const base = CL.db.ref(`erp/${c.cid}/data`);

        else (col === 'vouchers' ? [...S.vouchers, ...S.audit, ...S.queries] : S[col]).forEach(rec => { const r = remote[rec.id]; if (!rec.updatedAt) rec.updatedAt = Date.now(); if (!r || rec.updatedAt > r.updatedAt) CL.q[col + '/' + rec.id] = { updatedAt: rec.updatedAt, j: JSON.stringify(rec) }; });
      }

    }
    await clSaveQ(); c.inited = true; delete c.uploadLocal; CL.denied = false; await clSaveCfg(); return true;
  } catch (e) { if (isDenied(e)) CL.denied = true; else console.warn('init', e && e.code); clStatus(); return false; }

  if (!can('staff')) return denyToast();
  const x = id && STAFF && STAFF[id];
  if (!(await ask(id ? `Remove ${esc((x && (x.name || x.email)) || 'your CA')}? Their access to your company stops immediately.` : 'Cancel this invitation?', { ok: id ? 'Remove' : 'Yes, cancel', danger: !!id }))) return;
  const cid = CL.cfg.cid, up = { [`erp/${cid}/caInvites/${ek}`]: null, [`caInvitesByEmail/${ek}/${cid}`]: null };
  if (id) { up[`erp/${cid}/members/${id}`] = null; up[`erpCA/${id}/${cid}`] = null; }
  try { await CL.db.ref().update(up); toast(id ? 'CA removed' : 'Invitation cancelled'); loadStaff(); } catch (e) { toast(authMsg(e)); }
}

  <p class="mu" style="font-size:12.5px;margin:6px 0 10px">Optional. Turn it on to back up data to the cloud, use it on several phones and give staff their own login. Without the cloud the app keeps working offline.</p>

  <div class="kv"><span>Company</span><b>${esc(co().name || c.company || '—')}</b></div>
  <div class="kv"><span>Login</span><span>${esc(c.email)}</span></div>
  <div class="kv"><span>Your Role</span><b id="myRole">${esc(ROLES[c.role] || c.role)}</b></div>
  ${rules}
  <div class="btns" style="margin-top:10px"><button class="btn sec sm" onclick="clRetry()">🔄 Sync Now</button>${s.k === 'login' ? `<button class="btn sm" onclick="cloudSheet('login')">Log In</button>` : ''}<button class="btn ghost sm" id="clLogout" onclick="clLogout()">Logout</button></div></div>
  ${c.role === 'owner' ? `<div class="sect">Staff (Team)</div><div class="card"><div class="list" id="staffList" style="margin:0 0 10px"><div class="mu" style="font-size:13px">Loading...</div></div><button class="btn full" id="staffAddBtn" onclick="staffAdd()">+ Add Staff</button>
  <p class="mu" style="font-size:12px;margin:8px 0 0">Roles: Manager = ${ROLE_INFO.manager}. Billing = ${ROLE_INFO.billing}. Viewer = ${ROLE_INFO.viewer}.</p></div>
  <div class="sect">Your CA / Accountant</div><div class="card" id="caCard"><div class="list" id="caList" style="margin:0 0 10px"><div class="mu" style="font-size:13px">Loading...</div></div>
  <div class="f"><label>CA email</label><input id="ca_inv" type="email" autocomplete="off" placeholder="ca@firm.in"></div><button class="btn full" id="caInvBtn" onclick="caInvite()">Invite your CA</button>
  <p class="mu" style="font-size:12px;margin:8px 0 0">Your CA can see all entries and reports, export them and ask you questions. They cannot add, change or delete anything${S.settings.caLock !== false ? ' (they can lock periods and mark GST filed — change this under Period Lock)' : ''}. They log in with this email using “Accountant / CA Login”.</p></div>` : ''}
  ${caAcct() ? `<div class="btns" style="margin-top:10px"><button class="btn sec full" id="clientsBtn" onclick="go('clients')">👥 My Clients</button></div>` : ''}`;
}
async function clBoot() {
  CL.cfg = (await DB.get('kv', 'cloud')) || null;
  CL.q = (await DB.get('kv', 'syncq')) || {};
  CL.tombs = (await DB.get('kv', 'tombs')) || {};
  if (CL.cfg) clStart();
}

/* ================= Boot ================= */
let HIDDEN_AT = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) HIDDEN_AT = Date.now(); else if (S.settings && S.settings.pin && HIDDEN_AT && Date.now() - HIDDEN_AT > 120000 && !$('#lock').classList.contains('on')) lockScreen('unlock'); });
(async function boot() {
  try { let ac = ''; try { ac = localStorage.getItem('erpActive') || ''; } catch (e) { } if (ac && caAcct()) DB.name = 'erp-db-' + ac; await DB.open(); await loadAll(); await clBoot(); }
  catch (e) { $('#main').innerHTML = emptyBox('⚠️', 'Storage could not be opened', 'If the browser is in private mode, open the app in normal mode.'); return; }
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/home');
  trackNav();
  if (S.settings.pin) lockScreen('unlock');
  render();
  setTimeout(() => { wkNotify(); }, 1500);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => { });
})();
